<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Demo</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light;
      --sky: #87ceeb;
      --panel: rgba(255, 248, 240, 0.18);
      --panel-border: rgba(255, 255, 255, 0.24);
      --panel-shadow: rgba(51, 27, 15, 0.18);
      --ink: #1d1b22;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--sky);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 18px 45px var(--panel-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      color: #fff;
    }

    #title {
      max-width: 400px;
      padding: 16px 18px;
    }

    #title h1 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #title p {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      opacity: 0.95;
    }

    #hud {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    #fps {
      padding: 10px 14px;
      min-width: 76px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    #hint {
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.45;
      max-width: 280px;
      color: rgba(255, 255, 255, 0.92);
    }

    @media (max-width: 720px) {
      #ui {
        padding: 12px;
        flex-direction: column;
        justify-content: space-between;
      }

      #title {
        max-width: none;
      }

      #hud {
        margin-top: auto;
        align-self: flex-end;
        flex-direction: column;
        align-items: flex-end;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/supereggbert/proctree.js/proctree.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <div id="title" class="panel">
      <h1>Sakura Demo</h1>
      <p>Orbit around the tree. Blossoms are seeded from twig positions, and petals respawn around the canopy.</p>
    </div>
    <div id="hud">
      <div id="fps" class="panel">0 fps</div>
      <div id="hint" class="panel">Drag to orbit. Wheel to zoom. Use the control panel in the top-right to tune wind and petals.</div>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('scene');
    const fpsEl = document.getElementById('fps');

    const CONFIG = {
      gravity: 0.0008,
      windStrength: 0.003,
      airResistance: 0.98,
      fallSpeedMin: 0.008,
      fallSpeedMax: 0.015,
      groundY: 0.01,
      autoRotateSpeed: 0.3,
    };

    const PARAMS = {
      petalCount: 500,
      windStrength: 0.003,
      gravity: 0.0008,
      airResistance: 0.98,
      autoRotate: true,
    };

    const BLOSSOM_POSITIONS = [];
    const petals = [];
    const dummy = new THREE.Object3D();
    const clock = new THREE.Clock();

    let scene;
    let camera;
    let renderer;
    let controls;
    let petalMesh;
    let petalGeometry;
    let petalMaterial;
    let fpsFrames = 0;
    let fpsStamp = performance.now();

    initScene();
    createGround();
    createTree();
    createPetals(PARAMS.petalCount);
    initUI();
    onWindowResize();
    animate();

    window.addEventListener('resize', onWindowResize);

    function initScene() {
      scene = new THREE.Scene();
      scene.background = null;
      scene.fog = null;

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 4, 8);
      camera.lookAt(0, 1.5, 0);

      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.setClearColor(0x87ceeb, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.5, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.minDistance = 3;
      controls.maxDistance = 15;
      controls.autoRotate = PARAMS.autoRotate;
      controls.autoRotateSpeed = CONFIG.autoRotateSpeed;
      controls.update();

      const ambient = new THREE.AmbientLight(0xfff8f0, 0.8);
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
      keyLight.position.set(5, 10, 5);
      const rimLight = new THREE.DirectionalLight(0xc8e8ff, 0.4);
      rimLight.position.set(-3, 5, -3);

      scene.add(ambient, keyLight, rimLight);
    }

    function createGround() {
      const islandGeo = new THREE.CylinderGeometry(3.5, 4.0, 0.6, 8);
      const islandPos = islandGeo.attributes.position;
      for (let i = 0; i < islandPos.count; i++) {
        const y = islandPos.getY(i);
        if (y > 0) {
          islandPos.setX(i, islandPos.getX(i) + (Math.random() - 0.5) * 0.2);
          islandPos.setZ(i, islandPos.getZ(i) + (Math.random() - 0.5) * 0.2);
          islandPos.setY(i, y + Math.random() * 0.05);
        }
      }
      islandGeo.computeVertexNormals();

      const grassMat = new THREE.MeshLambertMaterial({ color: 0x7ec850 });
      const sideMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
      const island = new THREE.Mesh(islandGeo, [sideMat, grassMat, sideMat]);
      scene.add(island);

      const groundGeo = new THREE.PlaneGeometry(60, 60, 8, 8);
      const groundPos = groundGeo.attributes.position;
      for (let i = 0; i < groundPos.count; i++) {
        groundPos.setZ(i, groundPos.getZ(i) + (Math.random() - 0.5) * 0.3);
      }
      groundGeo.computeVertexNormals();

      const groundMat = new THREE.MeshLambertMaterial({ color: 0x6aaa40 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.31;
      scene.add(ground);
    }

    function flattenVertices(vertices) {
      const flat = [];
      for (let i = 0; i < vertices.length; i++) {
        const v = vertices[i];
        if (Array.isArray(v)) {
          flat.push(v[0], v[1], v[2]);
        } else {
          flat.push(v.x, v.y, v.z);
        }
      }
      return flat;
    }

    function flattenFaces(faces) {
      const flat = [];
      for (let i = 0; i < faces.length; i++) {
        const f = faces[i];
        if (Array.isArray(f)) {
          flat.push(f[0], f[1], f[2]);
        } else {
          flat.push(f.a, f.b, f.c);
        }
      }
      return flat;
    }

    function buildTreeGeometry(vertices, faces) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(flattenVertices(vertices), 3));
      geometry.setIndex(flattenFaces(faces));
      geometry.computeVertexNormals();
      return geometry;
    }

    function normalizeTwigVertices(tree) {
      const twigVertices = tree.vertsTwig || tree.twigVerts || [];
      const positions = [];
      for (let i = 0; i < twigVertices.length; i++) {
        const v = twigVertices[i];
        if (Array.isArray(v)) {
          positions.push(new THREE.Vector3(v[0], v[1] + 0.3, v[2]));
        } else {
          positions.push(new THREE.Vector3(v.x, v.y + 0.3, v.z));
        }
      }
      return positions;
    }

    function createTree() {
      BLOSSOM_POSITIONS.length = 0;

      const treeParams = {
        clumpMax: 0.454,
        clumpMin: 0.404,
        lengthFalloffFactor: 0.85,
        lengthFalloffPower: 0.99,
        branchFactor: 2.8,
        radiusFalloffRate: 0.6,
        climbRate: 0.5,
        trunkKink: 0.09,
        maxRadius: 0.12,
        treeSteps: 5,
        taperRate: 0.95,
        twistRate: 3.02,
        segments: 6,
        levels: 4,
        sweepAmount: 0,
        initalBranchLength: 0.85,
        trunkLength: 1.8,
        dropAmount: -0.1,
        growAmount: 0.235,
        vMultiplier: 0.36,
        twigScale: 0.35,
        seed: 262,
      };

      const tree = new window.Tree(treeParams);

      const trunkGeo = buildTreeGeometry(tree.verts, tree.faces);
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x3d1c0f });
      const trunkMesh = new THREE.Mesh(trunkGeo, trunkMat);
      trunkMesh.position.y = 0.3;
      scene.add(trunkMesh);

      const twigPositions = normalizeTwigVertices(tree);
      const placedPositions = new Set();
      let blossomCount = 0;

      for (let i = 0; i < twigPositions.length; i += 6) {
        if (blossomCount > 40) {
          break;
        }

        const pos = twigPositions[i];
        const key = `${Math.round(pos.x * 2)},${Math.round(pos.y * 2)},${Math.round(pos.z * 2)}`;
        if (placedPositions.has(key)) {
          continue;
        }
        placedPositions.add(key);

        const size = 0.35 + Math.random() * 0.25;
        const blossomGeo = new THREE.SphereGeometry(size, 5, 4);
        const posAttr = blossomGeo.attributes.position;
        for (let v = 0; v < posAttr.count; v++) {
          posAttr.setX(v, posAttr.getX(v) + (Math.random() - 0.5) * 0.1);
          posAttr.setY(v, posAttr.getY(v) + (Math.random() - 0.5) * 0.1);
          posAttr.setZ(v, posAttr.getZ(v) + (Math.random() - 0.5) * 0.1);
        }
        blossomGeo.computeVertexNormals();

        const hue = 0.93 + Math.random() * 0.04;
        const blossomColor = new THREE.Color().setHSL(hue, 0.7, 0.72);
        const blossom = new THREE.Mesh(
          blossomGeo,
          new THREE.MeshLambertMaterial({ color: blossomColor, side: THREE.DoubleSide })
        );
        blossom.position.copy(pos);
        scene.add(blossom);
        BLOSSOM_POSITIONS.push(pos.clone());
        blossomCount += 1;
      }
    }

    function disposePetals() {
      if (petalMesh) {
        scene.remove(petalMesh);
        petalMesh.geometry.dispose();
        petalMesh.material.dispose();
        petalMesh = null;
      }
      petals.length = 0;
    }

    function createPetalMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: {
          color: { value: new THREE.Color(0xf0b0c8) },
        },
        vertexShader: `
          precision highp float;
          varying vec2 vUv;

          void main() {
            vUv = uv;
            vec4 worldPosition = instanceMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * modelViewMatrix * worldPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          uniform vec3 color;
          varying vec2 vUv;

          void main() {
            vec2 uv = vUv - 0.5;
            float d1 = length(uv - vec2(-0.18, 0.05)) - 0.28;
            float d2 = length(uv - vec2( 0.18, 0.05)) - 0.28;
            float d3 = length(uv - vec2( 0.00, -0.15)) - 0.22;
            float d = min(min(d1, d2), d3);
            float alpha = 1.0 - smoothstep(-0.02, 0.02, d);

            if (alpha < 0.1) discard;

            float brightness = 1.0 + length(uv) * 0.3;
            gl_FragColor = vec4(color * brightness, alpha);
          }
        `,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
    }

    function createPetalGeometry() {
      const geometry = new THREE.PlaneGeometry(0.18, 0.12);
      geometry.computeBoundingSphere();
      return geometry;
    }

    function createPetals(count) {
      disposePetals();

      petalGeometry = createPetalGeometry();
      petalMaterial = createPetalMaterial();
      petalMesh = new THREE.InstancedMesh(petalGeometry, petalMaterial, count);
      petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      petalMesh.frustumCulled = false;
      scene.add(petalMesh);

      for (let i = 0; i < count; i++) {
        petals.push(createPetal(0));
        updatePetalMatrix(i);
      }

      petalMesh.instanceMatrix.needsUpdate = true;
    }

    function createPetal(now) {
      const petal = {
        position: new THREE.Vector3(),
        velocity: new THREE.Vector3(),
        rotation: new THREE.Euler(),
        rotationSpeed: new THREE.Vector3(),
        windPhase: Math.random() * Math.PI * 2,
        fallSpeed: CONFIG.fallSpeedMin,
        active: true,
        groundY: CONFIG.groundY,
        respawnAt: 0,
        scale: 1,
      };

      resetPetal(petal, now);
      return petal;
    }

    function sampleSpawnPoint() {
      const origins = BLOSSOM_POSITIONS.length > 0
        ? BLOSSOM_POSITIONS
        : [new THREE.Vector3(0, 3.5, 0)];

      const origin = origins[(Math.random() * origins.length) | 0];

      return new THREE.Vector3(
        origin.x + (Math.random() - 0.5) * 0.6,
        origin.y + (Math.random() - 0.5) * 0.3,
        origin.z + (Math.random() - 0.5) * 0.6
      );
    }

    function resetPetal(petal, now) {
      const spawn = sampleSpawnPoint();

      petal.position.copy(spawn);
      petal.velocity.set(
        (Math.random() - 0.5) * 0.02,
        -Math.random() * 0.005,
        (Math.random() - 0.5) * 0.02
      );
      petal.rotation.set(
        Math.random() * Math.PI * 2,
        Math.random() * Math.PI * 2,
        Math.random() * Math.PI * 2
      );
      petal.rotationSpeed.set(
        (Math.random() - 0.5) * 0.04,
        (Math.random() - 0.5) * 0.02,
        (Math.random() - 0.5) * 0.04
      );
      petal.windPhase = Math.random() * Math.PI * 2;
      petal.fallSpeed = CONFIG.fallSpeedMin + Math.random() * (CONFIG.fallSpeedMax - CONFIG.fallSpeedMin);
      petal.scale = 0.78 + Math.random() * 0.5;
      petal.active = true;
      petal.respawnAt = now + 0.9 + Math.random() * 1.4;
    }

    function updatePetalMatrix(index) {
      const petal = petals[index];
      dummy.position.copy(petal.position);
      dummy.rotation.copy(petal.rotation);
      dummy.scale.setScalar(petal.scale);
      dummy.updateMatrix();
      petalMesh.setMatrixAt(index, dummy.matrix);
    }

    function updatePetals(time) {
      for (let i = 0; i < petals.length; i++) {
        const petal = petals[i];

        if (!petal.active) {
          if (time >= petal.respawnAt) {
            resetPetal(petal, time);
          }
          updatePetalMatrix(i);
          continue;
        }

        petal.velocity.y -= PARAMS.gravity + petal.fallSpeed * 0.00015;
        petal.velocity.x += Math.sin(time * 0.8 + petal.windPhase) * PARAMS.windStrength;
        petal.velocity.z += Math.cos(time * 0.6 + petal.windPhase) * PARAMS.windStrength * 0.66;
        petal.velocity.multiplyScalar(PARAMS.airResistance);
        petal.position.add(petal.velocity);

        petal.rotation.x += petal.rotationSpeed.x;
        petal.rotation.y += petal.rotationSpeed.y;
        petal.rotation.z += petal.rotationSpeed.z;

        if (petal.position.y < petal.groundY) {
          petal.position.y = petal.groundY;
          petal.velocity.set(0, 0, 0);
          petal.rotationSpeed.set(0, 0, 0);
          petal.active = false;
          petal.respawnAt = time + 1.2 + Math.random() * 1.5;
        }

        updatePetalMatrix(i);
      }

      petalMesh.instanceMatrix.needsUpdate = true;
    }

    function initUI() {
      const pane = new Pane({ title: 'Sakura Controls' });

      pane.addBinding(PARAMS, 'petalCount', {
        min: 100,
        max: 5000,
        step: 100,
        label: 'Petals',
      }).on('change', (ev) => {
        createPetals(ev.value);
      });

      pane.addBinding(PARAMS, 'windStrength', {
        min: 0,
        max: 0.02,
        step: 0.001,
        label: 'Wind',
      });

      pane.addBinding(PARAMS, 'gravity', {
        min: 0.0001,
        max: 0.003,
        step: 0.0001,
        label: 'Gravity',
      });

      pane.addBinding(PARAMS, 'airResistance', {
        min: 0.9,
        max: 0.999,
        step: 0.001,
        label: 'Air Resist',
      });

      pane.addBinding(PARAMS, 'autoRotate', { label: 'Auto Rotate' })
        .on('change', (ev) => {
          controls.autoRotate = ev.value;
        });
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }

    function updateFps(now) {
      fpsFrames += 1;
      if (now - fpsStamp >= 1000) {
        const fps = Math.round((fpsFrames * 1000) / (now - fpsStamp));
        fpsEl.textContent = `${fps} fps`;
        fpsFrames = 0;
        fpsStamp = now;
      }
    }

    function animate() {
      const elapsed = clock.getElapsedTime();
      updatePetals(elapsed);
      controls.update();
      renderer.render(scene, camera);
      updateFps(performance.now());
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
