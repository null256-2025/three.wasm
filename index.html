<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Reverie</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light;
      --rose-50: rgba(255, 248, 252, 0.86);
      --rose-100: rgba(255, 240, 246, 0.56);
      --rose-200: rgba(228, 172, 189, 0.32);
      --rose-300: rgba(146, 83, 103, 0.88);
      --ink-soft: rgba(73, 43, 54, 0.9);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% 76%, #f9e1ea 0%, #f2c8d4 42%, #e3a8bc 100%);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Times New Roman", serif;
      color: var(--ink-soft);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 18px;
      box-sizing: border-box;
    }

    #header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .chip {
      padding: 11px 15px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: linear-gradient(135deg, var(--rose-50), var(--rose-100));
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow:
        0 18px 42px rgba(128, 64, 85, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    #title {
      max-width: 360px;
    }

    #title strong {
      display: block;
      font-size: 20px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #title span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(104, 60, 74, 0.86);
    }

    #stats {
      font-size: 12px;
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    #footer {
      display: flex;
      justify-content: center;
    }

    #hint {
      max-width: min(92vw, 620px);
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.06em;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      #overlay {
        padding: 12px;
      }

      #header {
        flex-direction: column;
        align-items: stretch;
      }

      #stats {
        text-align: left;
      }

      #title strong {
        font-size: 17px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/supereggbert/proctree.js/proctree.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay" aria-hidden="true">
    <div id="header">
      <div id="title" class="chip">
        <strong>Sakura Reverie</strong>
        <span>満開から散り終わりまでを、1枚ずつ積もる花びらで描く。</span>
      </div>
      <div id="stats" class="chip">fps 0 | 木 0 | 落下 0 | 地面 0</div>
    </div>
    <div></div>
    <div id="footer">
      <div id="hint" class="chip">ドラッグで回転 ・ スクロールでズーム ・ Fでフルスクリーン ・ 花びらは消えずに積もります</div>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const PETAL_COUNT = 2000;
    const PETAL_SIZE = 0.10;
    const GROUND_Y = 0.32;
    const GROUND_Y_OUTER = -0.20;
    const ISLAND_RADIUS = 3.2;
    const AUTO_ROTATE_SPEED = 0.3;
    const FIXED_DT = 1 / 60;

    const PARAMS = {
      windStrength: 0.002,
      gravity: 0.0006,
      airResistance: 0.97,
    };

    const PETAL_STATE = {
      ON_TREE: 0,
      FALLING: 1,
      ON_GROUND: 2,
    };

    const COLORS = {
      backdropTop: 0xfff7fb,
      backdropBottom: 0xe4afc0,
      fog: 0xf1d2dc,
      petal: 0xf7dce8,
      trunk: 0x5a3423,
      soil: 0x7a4d33,
      grass: 0xddd1cf,
      meadow: 0xdab8c4,
      meadowShadow: 0xc18f9e,
      lightWarm: 0xfff8f0,
      lightCool: 0xf3d8e2,
    };

    const BLOSSOM_POSITIONS = [];
    const petalData = [];
    const dummy = new THREE.Object3D();
    const statsEl = document.getElementById('stats');
    const canvas = document.getElementById('scene');

    let scene;
    let camera;
    let renderer;
    let controls;
    let petalMesh;
    let simTime = 0;
    let frameCount = 0;
    let accumulator = 0;
    let lastFrameTime = performance.now();
    let fpsFrameCounter = 0;
    let fpsStamp = performance.now();
    let fpsValue = 0;

    const stats = {
      onTree: PETAL_COUNT,
      falling: 0,
      onGround: 0,
    };

    initScene();
    createBackdrop();
    createGround();
    createTree();
    createRoots();
    createRocks();
    createPetals();
    refreshHud();
    render();

    window.render_game_to_text = renderGameToText;
    window.advanceTime = advanceTime;

    requestAnimationFrame(animate);

    function initScene() {
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(COLORS.fog, 16, 46);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 4.8, 10.8);
      camera.lookAt(0, 2.2, 0);

      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.22;
      renderer.sortObjects = true;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.autoRotate = true;
      controls.autoRotateSpeed = AUTO_ROTATE_SPEED;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;
      controls.minDistance = 4;
      controls.maxDistance = 16;
      controls.target.set(0, 2.2, 0);
      controls.update();

      const ambientLight = new THREE.AmbientLight(COLORS.lightWarm, 0.95);
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.25);
      keyLight.position.set(5, 10, 5);
      const fillLight = new THREE.DirectionalLight(COLORS.lightCool, 0.52);
      fillLight.position.set(-3, 5, -3);

      scene.add(ambientLight, keyLight, fillLight);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', onKeyDown);
      document.addEventListener('fullscreenchange', onWindowResize);
    }

    function createBackdrop() {
      const geometry = new THREE.SphereGeometry(70, 40, 20);
      const material = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        uniforms: {
          topColor: { value: new THREE.Color(COLORS.backdropTop) },
          bottomColor: { value: new THREE.Color(COLORS.backdropBottom) },
        },
        vertexShader: `
          varying float vMix;

          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vMix = clamp(worldPosition.y / 36.0 + 0.5, 0.0, 1.0);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 bottomColor;
          varying float vMix;

          void main() {
            float mixValue = smoothstep(0.0, 1.0, vMix);
            vec3 color = mix(bottomColor, topColor, mixValue);
            color += vec3(0.03, 0.01, 0.02) * pow(1.0 - mixValue, 2.0);
            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });

      scene.add(new THREE.Mesh(geometry, material));
    }

    function createGround() {
      const grassMaterial = new THREE.MeshLambertMaterial({ color: COLORS.grass });
      const soilMaterial = new THREE.MeshLambertMaterial({ color: COLORS.soil });

      const capGeometry = new THREE.CylinderGeometry(3.2, 3.2, 0.02, 10);
      const capMesh = new THREE.Mesh(capGeometry, grassMaterial);
      capMesh.position.y = 0.31;
      scene.add(capMesh);

      const bodyGeometry = new THREE.CylinderGeometry(3.2, 3.8, 0.6, 10, 1, false);
      const bodyPosition = bodyGeometry.attributes.position;
      for (let i = 0; i < bodyPosition.count; i += 1) {
        const y = bodyPosition.getY(i);
        const offsetStrength = y < 0 ? 0.15 : 0.08;
        bodyPosition.setX(i, bodyPosition.getX(i) + (Math.random() - 0.5) * offsetStrength);
        bodyPosition.setZ(i, bodyPosition.getZ(i) + (Math.random() - 0.5) * offsetStrength);
      }
      bodyGeometry.computeVertexNormals();

      const bodyMesh = new THREE.Mesh(bodyGeometry, [soilMaterial, grassMaterial, soilMaterial]);
      bodyMesh.position.y = 0.01;
      scene.add(bodyMesh);

      const meadowGeometry = new THREE.PlaneGeometry(120, 120, 12, 12);
      const meadowPosition = meadowGeometry.attributes.position;
      for (let i = 0; i < meadowPosition.count; i += 1) {
        meadowPosition.setZ(i, meadowPosition.getZ(i) + (Math.random() - 0.5) * 0.4);
      }
      meadowGeometry.computeVertexNormals();

      const meadowMaterial = new THREE.MeshLambertMaterial({ color: COLORS.meadow });
      const meadow = new THREE.Mesh(meadowGeometry, meadowMaterial);
      meadow.rotation.x = -Math.PI / 2;
      meadow.position.y = GROUND_Y_OUTER;
      scene.add(meadow);

      const glowGeometry = new THREE.CircleGeometry(5.8, 40);
      const glowMaterial = new THREE.MeshBasicMaterial({
        color: COLORS.meadowShadow,
        transparent: true,
        opacity: 0.12,
        depthWrite: false,
      });
      const glow = new THREE.Mesh(glowGeometry, glowMaterial);
      glow.rotation.x = -Math.PI / 2;
      glow.position.y = GROUND_Y_OUTER + 0.01;
      scene.add(glow);
    }

    function flattenVertices(vertices) {
      const flat = [];
      for (let i = 0; i < vertices.length; i += 1) {
        const vertex = vertices[i];
        if (Array.isArray(vertex)) {
          flat.push(vertex[0], vertex[1], vertex[2]);
        } else {
          flat.push(vertex.x, vertex.y, vertex.z);
        }
      }
      return flat;
    }

    function flattenFaces(faces) {
      const flat = [];
      for (let i = 0; i < faces.length; i += 1) {
        const face = faces[i];
        if (Array.isArray(face)) {
          flat.push(face[0], face[1], face[2]);
        } else {
          flat.push(face.a, face.b, face.c);
        }
      }
      return flat;
    }

    function buildTreeGeometry(vertices, faces) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(flattenVertices(vertices), 3));
      geometry.setIndex(flattenFaces(faces));

      const position = geometry.attributes.position;
      for (let i = 0; i < position.count; i += 1) {
        const y = position.getY(i);
        const radialBoost = THREE.MathUtils.clamp(0.35 - y * 0.12, 0.0, 0.28);
        if (radialBoost > 0) {
          position.setX(i, position.getX(i) * (1 + radialBoost));
          position.setZ(i, position.getZ(i) * (1 + radialBoost));
        }
      }

      geometry.computeVertexNormals();
      return geometry;
    }

    function collectTwigPositions(tree) {
      const twigVertices = tree.twigVerts || tree.vertsTwig || [];
      BLOSSOM_POSITIONS.length = 0;

      for (let i = 0; i < twigVertices.length; i += 3) {
        const vertex = twigVertices[i];
        const x = Array.isArray(vertex) ? vertex[0] : vertex.x;
        const y = Array.isArray(vertex) ? vertex[1] : vertex.y;
        const z = Array.isArray(vertex) ? vertex[2] : vertex.z;
        BLOSSOM_POSITIONS.push(new THREE.Vector3(x, y + 0.3, z));
      }

      const extra = [];
      for (let i = 0; i < BLOSSOM_POSITIONS.length; i += 1) {
        const position = BLOSSOM_POSITIONS[i];
        for (let j = 0; j < 5; j += 1) {
          extra.push(new THREE.Vector3(
            position.x + (Math.random() - 0.5) * 0.28,
            position.y + (Math.random() - 0.5) * 0.16,
            position.z + (Math.random() - 0.5) * 0.28
          ));
        }
      }

      BLOSSOM_POSITIONS.push(...extra);
    }

    function createTree() {
      const treeParams = {
        clumpMax: 0.454,
        clumpMin: 0.404,
        lengthFalloffFactor: 0.85,
        lengthFalloffPower: 0.99,
        branchFactor: 2.8,
        radiusFalloffRate: 0.6,
        climbRate: 0.5,
        trunkKink: 0.09,
        maxRadius: 0.12,
        treeSteps: 5,
        taperRate: 0.95,
        twistRate: 3.02,
        segments: 6,
        levels: 4,
        sweepAmount: 0,
        initialBranchLength: 0.85,
        initalBranchLength: 0.85,
        trunkLength: 1.8,
        dropAmount: -0.1,
        growAmount: 0.235,
        vMultiplier: 0.36,
        twigScale: 0.35,
        seed: 262,
      };

      const tree = new window.Tree(treeParams);
      const trunkGeometry = buildTreeGeometry(tree.verts, tree.faces);
      const trunkMaterial = new THREE.MeshLambertMaterial({ color: COLORS.trunk });
      const trunkMesh = new THREE.Mesh(trunkGeometry, trunkMaterial);
      trunkMesh.position.y = 0.3;
      scene.add(trunkMesh);

      collectTwigPositions(tree);
    }

    function createRoots() {
      const rootMaterial = new THREE.MeshLambertMaterial({ color: COLORS.trunk });
      const rootGeometry = new THREE.CylinderGeometry(0.065, 0.02, 0.95, 5);
      const configs = [
        { x: 0.36, z: 0.15, ry: -0.7, rz: -1.05 },
        { x: -0.32, z: 0.26, ry: 0.4, rz: 1.08 },
        { x: 0.15, z: -0.36, ry: 0.2, rz: -0.88 },
        { x: -0.18, z: -0.42, ry: -0.55, rz: 0.92 },
      ];

      for (let i = 0; i < configs.length; i += 1) {
        const config = configs[i];
        const root = new THREE.Mesh(rootGeometry, rootMaterial);
        root.position.set(config.x, 0.17, config.z);
        root.rotation.y = config.ry;
        root.rotation.z = config.rz;
        scene.add(root);
      }
    }

    function createRocks() {
      const configs = [
        { x: 0.8, z: 0.5, sx: 0.35, sy: 0.28, sz: 0.32, ry: 0.3 },
        { x: -0.5, z: 0.8, sx: 0.28, sy: 0.22, sz: 0.30, ry: 1.1 },
        { x: 0.3, z: -0.7, sx: 0.42, sy: 0.25, sz: 0.35, ry: 2.2 },
        { x: -0.9, z: -0.3, sx: 0.20, sy: 0.18, sz: 0.22, ry: 0.8 },
      ];

      for (let i = 0; i < configs.length; i += 1) {
        const config = configs[i];
        const geometry = new THREE.IcosahedronGeometry(0.5, 1);
        const position = geometry.attributes.position;
        for (let j = 0; j < position.count; j += 1) {
          position.setX(j, position.getX(j) + (Math.random() - 0.5) * 0.15);
          position.setY(j, position.getY(j) + (Math.random() - 0.5) * 0.10);
          position.setZ(j, position.getZ(j) + (Math.random() - 0.5) * 0.15);
        }
        geometry.computeVertexNormals();

        const brightness = 0.65 + Math.random() * 0.2;
        const material = new THREE.MeshLambertMaterial({
          color: new THREE.Color(brightness, brightness, brightness),
        });
        const rock = new THREE.Mesh(geometry, material);
        rock.position.set(config.x, 0.28 + config.sy * 0.3, config.z);
        rock.rotation.y = config.ry;
        rock.scale.set(config.sx, config.sy, config.sz);
        scene.add(rock);
      }
    }

    function createPetalMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: {
          color: { value: new THREE.Color(COLORS.petal) },
        },
        vertexShader: `
          varying vec2 vUv;
          varying float vBrightness;

          void main() {
            vUv = uv;
            vBrightness = 0.9 + fract(sin(float(gl_InstanceID) * 12.9898) * 43758.5453) * 0.2;
            gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 color;
          varying vec2 vUv;
          varying float vBrightness;

          void main() {
            vec2 uv = vUv - 0.5;
            float d1 = length(uv - vec2(-0.18, 0.05)) - 0.28;
            float d2 = length(uv - vec2(0.18, 0.05)) - 0.28;
            float d3 = length(uv - vec2(0.0, -0.15)) - 0.22;
            float d = min(min(d1, d2), d3);
            float alpha = 1.0 - smoothstep(-0.02, 0.02, d);
            if (alpha < 0.1) discard;

            vec3 c = color * vBrightness;
            c += (1.0 - length(uv) * 2.0) * 0.08;
            gl_FragColor = vec4(c, alpha);
          }
        `,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
    }

    function createPetals() {
      const petalGeometry = new THREE.PlaneGeometry(PETAL_SIZE * 1.5, PETAL_SIZE);
      const petalMaterial = createPetalMaterial();
      petalMesh = new THREE.InstancedMesh(petalGeometry, petalMaterial, PETAL_COUNT);
      petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      petalMesh.frustumCulled = false;
      petalMesh.renderOrder = 3;
      scene.add(petalMesh);

      petalData.length = 0;

      for (let i = 0; i < PETAL_COUNT; i += 1) {
        const origin = BLOSSOM_POSITIONS[(Math.random() * BLOSSOM_POSITIONS.length) | 0];
        const treePosition = new THREE.Vector3(
          origin.x + (Math.random() - 0.5) * 0.24,
          origin.y + (Math.random() - 0.5) * 0.14,
          origin.z + (Math.random() - 0.5) * 0.24
        );
        const rotation = new THREE.Euler(
          (Math.random() - 0.5) * 0.8,
          Math.random() * Math.PI * 2,
          (Math.random() - 0.5) * 0.8
        );
        const rotationSpeed = new THREE.Vector3(
          (Math.random() - 0.5) * 0.04,
          (Math.random() - 0.5) * 0.02,
          (Math.random() - 0.5) * 0.04
        );

        const petal = {
          state: PETAL_STATE.ON_TREE,
          treePosition,
          position: new THREE.Vector3(),
          velocity: new THREE.Vector3(),
          rotation,
          rotationSpeed,
          windPhase: Math.random() * Math.PI * 2,
          fallDelay: 180 + Math.floor(Math.random() * 3600),
          scale: 0.96 + Math.random() * 0.58,
          swayAmplitude: 0.004 + Math.random() * 0.006,
          groundOffset: Math.random() * 0.01,
        };

        petal.position.copy(treePosition);
        petalData.push(petal);

        dummy.position.copy(treePosition);
        dummy.rotation.copy(rotation);
        dummy.scale.setScalar(petal.scale);
        dummy.updateMatrix();
        petalMesh.setMatrixAt(i, dummy.matrix);
      }

      petalMesh.instanceMatrix.needsUpdate = true;
    }

    function updatePetals(time) {
      let matrixChanged = false;
      let onTree = 0;
      let falling = 0;
      let onGround = 0;

      for (let i = 0; i < petalData.length; i += 1) {
        const petal = petalData[i];

        if (petal.state === PETAL_STATE.ON_GROUND) {
          onGround += 1;
          continue;
        }

        if (petal.state === PETAL_STATE.ON_TREE) {
          const swayX = Math.sin(time * 1.7 + petal.windPhase) * petal.swayAmplitude;
          const swayY = Math.cos(time * 1.1 + petal.windPhase * 0.6) * petal.swayAmplitude * 0.65;
          const swayZ = Math.cos(time * 1.5 + petal.windPhase * 1.4) * petal.swayAmplitude;

          if (frameCount >= petal.fallDelay) {
            petal.state = PETAL_STATE.FALLING;
            petal.position.set(
              petal.treePosition.x + swayX,
              petal.treePosition.y + swayY,
              petal.treePosition.z + swayZ
            );
            petal.velocity.set(swayX * 0.18, -0.003 - Math.random() * 0.002, swayZ * 0.18);
          } else {
            dummy.position.set(
              petal.treePosition.x + swayX,
              petal.treePosition.y + swayY,
              petal.treePosition.z + swayZ
            );
            dummy.rotation.set(
              petal.rotation.x + swayX * 12,
              petal.rotation.y,
              petal.rotation.z + swayZ * 12
            );
            dummy.scale.setScalar(petal.scale);
            dummy.updateMatrix();
            petalMesh.setMatrixAt(i, dummy.matrix);
            matrixChanged = true;
            onTree += 1;
            continue;
          }
        }

        const wind =
          Math.sin(time * 0.8 + petal.windPhase) * PARAMS.windStrength +
          Math.sin(time * 1.7 + petal.windPhase * 1.3) * PARAMS.windStrength * 0.4 +
          Math.sin(time * 0.3 + petal.windPhase * 0.7) * PARAMS.windStrength * 0.6;

        petal.velocity.y -= PARAMS.gravity;
        petal.velocity.x += wind;
        petal.velocity.z += Math.cos(time * 0.6 + petal.windPhase) * PARAMS.windStrength * 0.8;
        petal.velocity.multiplyScalar(PARAMS.airResistance);
        petal.position.add(petal.velocity);
        petal.rotation.x += petal.rotationSpeed.x;
        petal.rotation.y += petal.rotationSpeed.y;
        petal.rotation.z += petal.rotationSpeed.z;

        const distFromCenter = Math.hypot(petal.position.x, petal.position.z);
        const groundLevel = distFromCenter < ISLAND_RADIUS ? GROUND_Y : GROUND_Y_OUTER;
        if (petal.position.y <= groundLevel) {
          petal.state = PETAL_STATE.ON_GROUND;
          petal.position.y = groundLevel + petal.groundOffset;
          petal.velocity.set(0, 0, 0);
          petal.rotationSpeed.set(0, 0, 0);
          petal.rotation.set(
            -Math.PI * 0.5 + (Math.random() - 0.5) * 0.18,
            Math.random() * Math.PI * 2,
            (Math.random() - 0.5) * 0.12
          );
          onGround += 1;
        } else {
          falling += 1;
        }

        dummy.position.copy(petal.position);
        dummy.rotation.copy(petal.rotation);
        dummy.scale.setScalar(petal.scale);
        dummy.updateMatrix();
        petalMesh.setMatrixAt(i, dummy.matrix);
        matrixChanged = true;
      }

      stats.onTree = onTree;
      stats.falling = falling;
      stats.onGround = onGround;

      if (matrixChanged) {
        petalMesh.instanceMatrix.needsUpdate = true;
      }
    }

    function step(deltaSeconds) {
      simTime += deltaSeconds;
      frameCount += 1;
      controls.update();
      updatePetals(simTime);
      refreshHud();
    }

    function render() {
      renderer.render(scene, camera);
    }

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = Math.min(0.05, (now - lastFrameTime) * 0.001);
      lastFrameTime = now;
      accumulator += delta;

      while (accumulator >= FIXED_DT) {
        step(FIXED_DT);
        accumulator -= FIXED_DT;
      }

      render();
      updateFps(now);
    }

    function updateFps(now) {
      fpsFrameCounter += 1;
      if (now - fpsStamp >= 1000) {
        fpsValue = Math.round((fpsFrameCounter * 1000) / (now - fpsStamp));
        fpsFrameCounter = 0;
        fpsStamp = now;
        refreshHud();
      }
    }

    function refreshHud() {
      statsEl.textContent =
        `fps ${fpsValue} | 木 ${stats.onTree} | 落下 ${stats.falling} | 地面 ${stats.onGround}`;
    }

    function roundValue(value) {
      return Math.round(value * 100) / 100;
    }

    function renderGameToText() {
      const fallingSample = [];
      for (let i = 0; i < petalData.length && fallingSample.length < 8; i += 1) {
        const petal = petalData[i];
        if (petal.state === PETAL_STATE.FALLING) {
          fallingSample.push({
            x: roundValue(petal.position.x),
            y: roundValue(petal.position.y),
            z: roundValue(petal.position.z),
          });
        }
      }

      return JSON.stringify({
        coordinateSystem: 'origin=(0,0,0), +x=right, +y=up, +z=toward initial camera',
        time: roundValue(simTime),
        petals: {
          total: PETAL_COUNT,
          onTree: stats.onTree,
          falling: stats.falling,
          onGround: stats.onGround,
        },
        camera: {
          x: roundValue(camera.position.x),
          y: roundValue(camera.position.y),
          z: roundValue(camera.position.z),
        },
        target: {
          x: roundValue(controls.target.x),
          y: roundValue(controls.target.y),
          z: roundValue(controls.target.z),
        },
        fullscreen: Boolean(document.fullscreenElement),
        fallingSample,
      });
    }

    function advanceTime(ms) {
      const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
      accumulator = 0;
      for (let i = 0; i < steps; i += 1) {
        step(FIXED_DT);
      }
      render();
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      render();
    }

    function onKeyDown(event) {
      if (event.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen?.();
      } else {
        document.documentElement.requestFullscreen?.();
      }
    }
  </script>
</body>
</html>
