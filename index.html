<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Reverie</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light;
      --rose-50: rgba(255, 248, 252, 0.86);
      --rose-100: rgba(255, 240, 246, 0.56);
      --ink-soft: rgba(73, 43, 54, 0.9);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: radial-gradient(circle at 50% 76%, #f9e1ea 0%, #f2c8d4 42%, #e3a8bc 100%);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Times New Roman", serif;
      color: var(--ink-soft);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 18px;
      box-sizing: border-box;
    }

    #header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .chip {
      padding: 11px 15px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: linear-gradient(135deg, var(--rose-50), var(--rose-100));
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow:
        0 18px 42px rgba(128, 64, 85, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    #title {
      max-width: 360px;
    }

    #title strong {
      display: block;
      font-size: 20px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #title span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(104, 60, 74, 0.86);
    }

    #controls {
      pointer-events: auto;
      min-width: 260px;
      display: grid;
      gap: 10px;
    }

    #stats {
      font-size: 12px;
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: pre-line;
    }

    #petal-panel {
      display: grid;
      gap: 8px;
      font-size: 12px;
      line-height: 1.4;
    }

    #petal-row {
      display: grid;
      grid-template-columns: 1fr 96px;
      gap: 10px;
      align-items: center;
    }

    #petal-range,
    #petal-number {
      width: 100%;
      margin: 0;
      accent-color: #d780a0;
      pointer-events: auto;
    }

    #petal-number {
      box-sizing: border-box;
      border: 1px solid rgba(156, 97, 117, 0.22);
      border-radius: 12px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.65);
      color: var(--ink-soft);
      font: inherit;
    }

    #petal-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset-btn {
      pointer-events: auto;
      border: 1px solid rgba(156, 97, 117, 0.22);
      border-radius: 999px;
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.6);
      color: var(--ink-soft);
      font: inherit;
      cursor: pointer;
    }

    #footer {
      display: flex;
      justify-content: center;
    }

    #hint {
      max-width: min(92vw, 640px);
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.06em;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      #overlay {
        padding: 12px;
      }

      #header {
        flex-direction: column;
        align-items: stretch;
      }

      #controls {
        min-width: 0;
      }

      #stats {
        text-align: left;
      }

      #title strong {
        font-size: 17px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/supereggbert/proctree.js/proctree.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay" aria-hidden="true">
    <div id="header">
      <div id="title" class="chip">
        <strong>Sakura Reverie</strong>
        <span>花びらがほどけていく流れを、木の上から地面まで静かに追いかける。</span>
      </div>
      <div id="controls">
        <div id="stats" class="chip">fps 0 | petals 0 | 木 0 | 落下 0 | 地面 0</div>
        <div id="petal-panel" class="chip">
          <div>Petals</div>
          <div id="petal-row">
            <input id="petal-range" type="range" min="1000" max="100000" step="500" value="2000" />
            <input id="petal-number" type="number" min="1000" max="100000" step="500" value="2000" />
          </div>
          <div id="petal-presets">
            <button class="preset-btn" type="button" data-petals="2000">2000</button>
            <button class="preset-btn" type="button" data-petals="16000">16000</button>
            <button class="preset-btn" type="button" data-petals="24000">24000</button>
            <button class="preset-btn" type="button" data-petals="50000">50000</button>
            <button class="preset-btn" type="button" data-petals="100000">100000</button>
          </div>
        </div>
      </div>
    </div>
    <div></div>
    <div id="footer">
      <div id="hint" class="chip">ドラッグで回転 ・ スクロールでズーム ・ Fでフルスクリーン ・ 50000枚超では自動で軽量描画に切り替え</div>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const DEFAULT_PETAL_COUNT = 2000;
    const MIN_PETAL_COUNT = 1000;
    const MAX_PETAL_COUNT = 100000;
    const PETAL_STEP = 500;
    const PETAL_SIZE = 0.10;
    const DEFAULT_GROUND_UPLOAD_BATCH = 1024;
    const MAX_GROUND_UPLOAD_BATCH = 65536;
    const TREE_UPLOAD_BYTES_PER_INSTANCE = 36;
    const DYNAMIC_UPLOAD_BYTES_PER_INSTANCE = 32;
    const PERF_SAMPLE_ALPHA = 0.16;
    const DENSE_COUNT_THRESHOLD = 50000;
    const ULTRA_COUNT_THRESHOLD = 80000;
    const GROUND_Y = 0.32;
    const GROUND_Y_OUTER = -0.20;
    const ISLAND_RADIUS = 3.2;
    const AUTO_ROTATE_SPEED = 0.3;
    const FIXED_DT = 1 / 60;
    const WASM_PATH = './target/wasm32-unknown-unknown/release/sakura_sim.wasm';

    const PARAMS = {
      windStrength: 0.002,
      gravity: 0.0006,
      airResistance: 0.97,
    };

    const COLORS = {
      backdropTop: 0xfff7fb,
      backdropBottom: 0xe4afc0,
      fog: 0xf1d2dc,
      petal: 0xf7dce8,
      petalGround: 0xe7c6d3,
      trunk: 0x5a3423,
      soil: 0x7a4d33,
      grass: 0xddd1cf,
      meadow: 0xdab8c4,
      meadowShadow: 0xc18f9e,
      lightWarm: 0xfff8f0,
      lightCool: 0xf3d8e2,
    };

    const TREE_VERTEX_SHADER = `
      attribute vec3 baseOffset;
      attribute vec3 baseRotation;
      attribute float aPhase;
      attribute float aScale;
      attribute float aBrightness;

      uniform float time;

      varying vec2 vUv;
      varying float vBrightness;
      varying float vVisible;

      mat3 rotateX(float angle) {
        float s = sin(angle);
        float c = cos(angle);
        return mat3(
          1.0, 0.0, 0.0,
          0.0, c, -s,
          0.0, s, c
        );
      }

      mat3 rotateY(float angle) {
        float s = sin(angle);
        float c = cos(angle);
        return mat3(
          c, 0.0, s,
          0.0, 1.0, 0.0,
          -s, 0.0, c
        );
      }

      mat3 rotateZ(float angle) {
        float s = sin(angle);
        float c = cos(angle);
        return mat3(
          c, -s, 0.0,
          s, c, 0.0,
          0.0, 0.0, 1.0
        );
      }

      void main() {
        vUv = uv;
        vBrightness = aBrightness;
        vVisible = 1.0;

        float swayX = sin(time * 1.35 + aPhase) * 0.013;
        float swayY = cos(time * 1.05 + aPhase * 0.6) * 0.007;
        float swayZ = cos(time * 1.45 + aPhase * 1.2) * 0.013;
        float twist = sin(time * 1.6 + aPhase * 1.1) * 0.18;

        vec3 transformed = position * aScale;
        transformed = rotateY(baseRotation.y + twist * 0.15) * transformed;
        transformed = rotateZ(baseRotation.z + twist * 0.08) * transformed;
        transformed = rotateX(baseRotation.x + twist * 0.12) * transformed;
        transformed += baseOffset + vec3(swayX, swayY, swayZ);

        gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
      }
    `;

    const DYNAMIC_VERTEX_SHADER = `
      attribute vec3 aOffset;
      attribute vec3 aRotation;
      attribute float aScale;
      attribute float aBrightness;

      varying vec2 vUv;
      varying float vBrightness;
      varying float vVisible;

      mat3 rotateX(float angle) {
        float s = sin(angle);
        float c = cos(angle);
        return mat3(
          1.0, 0.0, 0.0,
          0.0, c, -s,
          0.0, s, c
        );
      }

      mat3 rotateY(float angle) {
        float s = sin(angle);
        float c = cos(angle);
        return mat3(
          c, 0.0, s,
          0.0, 1.0, 0.0,
          -s, 0.0, c
        );
      }

      mat3 rotateZ(float angle) {
        float s = sin(angle);
        float c = cos(angle);
        return mat3(
          c, -s, 0.0,
          s, c, 0.0,
          0.0, 0.0, 1.0
        );
      }

      void main() {
        vUv = uv;
        vBrightness = aBrightness;
        vVisible = 1.0;

        vec3 transformed = position * aScale;
        transformed = rotateY(aRotation.y) * transformed;
        transformed = rotateZ(aRotation.z) * transformed;
        transformed = rotateX(aRotation.x) * transformed;
        transformed += aOffset;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
      }
    `;

    const PETAL_FRAGMENT_SHADER = `
      uniform vec3 color;

      varying vec2 vUv;
      varying float vBrightness;
      varying float vVisible;

      void main() {
        if (vVisible < 0.5) {
          discard;
        }

        vec2 uv = vUv - 0.5;
        float d1 = length(uv - vec2(-0.18, 0.05)) - 0.28;
        float d2 = length(uv - vec2(0.18, 0.05)) - 0.28;
        float d3 = length(uv - vec2(0.0, -0.15)) - 0.22;
        float d = min(min(d1, d2), d3);
        float alpha = 1.0 - smoothstep(-0.02, 0.02, d);
        if (alpha < 0.1) {
          discard;
        }

        vec3 lit = color * vBrightness;
        lit += (1.0 - length(uv) * 2.0) * 0.08;
        gl_FragColor = vec4(lit, alpha);
      }
    `;

    const DENSE_PETAL_FRAGMENT_SHADER = `
      uniform vec3 color;

      varying vec2 vUv;
      varying float vBrightness;

      void main() {
        vec2 uv = vUv - 0.5;
        float centerGlow = clamp(1.0 - dot(uv * 1.8, uv * 1.4), 0.0, 1.0);
        vec3 lit = color * vBrightness;
        lit += centerGlow * 0.05;
        gl_FragColor = vec4(lit, 1.0);
      }
    `;

    const BLOSSOM_POSITIONS = [];
    const statsEl = document.getElementById('stats');
    const canvas = document.getElementById('scene');
    const petalRangeEl = document.getElementById('petal-range');
    const petalNumberEl = document.getElementById('petal-number');
    const presetButtonEls = Array.from(document.querySelectorAll('[data-petals]'));
    const sakuraWasm = await loadSakuraWasm();

    const wasmViews = {
      count: 0,
      posX: null,
      posY: null,
      posZ: null,
      rotX: null,
      rotY: null,
      rotZ: null,
      treePosX: null,
      treePosY: null,
      treePosZ: null,
      treeRotX: null,
      treeRotY: null,
      treeRotZ: null,
      phase: null,
      scale: null,
      brightness: null,
      activeIndices: null,
      activatedIndices: null,
      landedIndices: null,
    };

    let scene;
    let camera;
    let renderer;
    let controls;
    let treePetalLayer = null;
    let fallingPetalLayer = null;
    let groundPetalLayer = null;
    let groundLandingQueue = new Uint32Array(0);
    let groundLandingQueueHead = 0;
    let groundLandingQueueTail = 0;
    let groundLandingQueueCount = 0;
    let groundUploadBudget = DEFAULT_GROUND_UPLOAD_BATCH;
    let currentPetalCount = getInitialPetalCount();
    let simTime = 0;
    let frameCount = 0;
    let accumulator = 0;
    let lastFrameTime = performance.now();
    let fpsFrameCounter = 0;
    let fpsStamp = performance.now();
    let fpsValue = 0;

    const stats = {
      onTree: currentPetalCount,
      falling: 0,
      onGround: 0,
    };

    const perfStats = {
      bottleneck: 'warming_up',
      frameCpuMs: 0,
      renderCpuMs: 0,
      wasmActivateMs: 0,
      wasmStepMs: 0,
      groundQueueMs: 0,
      fallingUploadMs: 0,
      gpuRenderMs: null,
      uploadedBytesPerFrame: 0,
      treeUploadBytesPerFrame: 0,
      fallingUploadBytesPerFrame: 0,
      groundUploadBytesPerFrame: 0,
      activePeak: 0,
      queuePeak: 0,
      treePeak: currentPetalCount,
      lastActivatedCount: 0,
      lastLandedCount: 0,
      lastGroundFlushCount: 0,
      gpuSupported: false,
      gpuSamples: 0,
    };

    const gpuTimer = {
      ext: null,
      pendingQueries: [],
      activeQuery: null,
      isWebGL2: false,
    };

    let currentQualityProfile = resolveQualityProfile(currentPetalCount);

    initScene();
    createBackdrop();
    createGround();
    createTree();
    createRoots();
    createRocks();
    createPetals(currentPetalCount);
    initPetalControls();
    refreshHud();
    render();

    window.render_game_to_text = renderGameToText;
    window.advanceTime = advanceTime;
    window.setPetalCount = setPetalCount;
    window.setGroundUploadBudget = setGroundUploadBudget;

    requestAnimationFrame(animate);

    async function loadSakuraWasm() {
      const response = await fetch(WASM_PATH);
      try {
        if (WebAssembly.instantiateStreaming) {
          const { instance } = await WebAssembly.instantiateStreaming(response.clone(), {});
          return instance.exports;
        }
      } catch (error) {
        console.warn('Falling simulation streaming compile failed, retrying with arrayBuffer.', error);
      }

      const bytes = await response.arrayBuffer();
      const { instance } = await WebAssembly.instantiate(bytes, {});
      return instance.exports;
    }

    function refreshWasmViews() {
      const count = sakuraWasm.sim_petal_count();
      const memory = sakuraWasm.memory.buffer;

      wasmViews.count = count;
      wasmViews.posX = new Float32Array(memory, sakuraWasm.sim_pos_x_ptr(), count);
      wasmViews.posY = new Float32Array(memory, sakuraWasm.sim_pos_y_ptr(), count);
      wasmViews.posZ = new Float32Array(memory, sakuraWasm.sim_pos_z_ptr(), count);
      wasmViews.rotX = new Float32Array(memory, sakuraWasm.sim_rot_x_ptr(), count);
      wasmViews.rotY = new Float32Array(memory, sakuraWasm.sim_rot_y_ptr(), count);
      wasmViews.rotZ = new Float32Array(memory, sakuraWasm.sim_rot_z_ptr(), count);
      wasmViews.treePosX = new Float32Array(memory, sakuraWasm.sim_tree_pos_x_ptr(), count);
      wasmViews.treePosY = new Float32Array(memory, sakuraWasm.sim_tree_pos_y_ptr(), count);
      wasmViews.treePosZ = new Float32Array(memory, sakuraWasm.sim_tree_pos_z_ptr(), count);
      wasmViews.treeRotX = new Float32Array(memory, sakuraWasm.sim_tree_rot_x_ptr(), count);
      wasmViews.treeRotY = new Float32Array(memory, sakuraWasm.sim_tree_rot_y_ptr(), count);
      wasmViews.treeRotZ = new Float32Array(memory, sakuraWasm.sim_tree_rot_z_ptr(), count);
      wasmViews.phase = new Float32Array(memory, sakuraWasm.sim_phase_ptr(), count);
      wasmViews.scale = new Float32Array(memory, sakuraWasm.sim_scale_ptr(), count);
      wasmViews.brightness = new Float32Array(memory, sakuraWasm.sim_brightness_ptr(), count);
      wasmViews.activeIndices = new Uint32Array(memory, sakuraWasm.sim_active_indices_ptr(), count);
      wasmViews.activatedIndices = new Uint32Array(memory, sakuraWasm.sim_activated_indices_ptr(), count);
      wasmViews.landedIndices = new Uint32Array(memory, sakuraWasm.sim_landed_indices_ptr(), count);
    }

    function smoothMetric(previous, nextValue) {
      if (!Number.isFinite(nextValue)) {
        return previous;
      }
      if (!Number.isFinite(previous) || previous <= 0) {
        return nextValue;
      }
      return previous + (nextValue - previous) * PERF_SAMPLE_ALPHA;
    }

    function recordPerfMetric(key, value) {
      perfStats[key] = smoothMetric(perfStats[key], value);
    }

    function updatePerfBottleneck() {
      const candidates = [
        { label: 'gpu_render', value: perfStats.gpuRenderMs ?? 0 },
        { label: 'falling_upload', value: perfStats.fallingUploadMs },
        { label: 'wasm_step', value: perfStats.wasmStepMs },
        { label: 'wasm_activate', value: perfStats.wasmActivateMs },
        { label: 'ground_queue', value: perfStats.groundQueueMs },
      ];
      candidates.sort((left, right) => right.value - left.value);
      perfStats.bottleneck = candidates[0].value > 0.25 ? candidates[0].label : 'balanced';
    }

    function resetPerfStats() {
      perfStats.bottleneck = 'warming_up';
      perfStats.frameCpuMs = 0;
      perfStats.renderCpuMs = 0;
      perfStats.wasmActivateMs = 0;
      perfStats.wasmStepMs = 0;
      perfStats.groundQueueMs = 0;
      perfStats.fallingUploadMs = 0;
      perfStats.gpuRenderMs = null;
      perfStats.uploadedBytesPerFrame = 0;
      perfStats.treeUploadBytesPerFrame = 0;
      perfStats.fallingUploadBytesPerFrame = 0;
      perfStats.groundUploadBytesPerFrame = 0;
      perfStats.activePeak = 0;
      perfStats.queuePeak = 0;
      perfStats.treePeak = currentPetalCount;
      perfStats.lastActivatedCount = 0;
      perfStats.lastLandedCount = 0;
      perfStats.lastGroundFlushCount = 0;
      perfStats.gpuSamples = 0;
    }

    function initGpuTimerQuery() {
      const gl = renderer.getContext();
      if (!(gl instanceof WebGL2RenderingContext)) {
        return;
      }

      const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
      if (!ext) {
        return;
      }

      gpuTimer.ext = ext;
      gpuTimer.isWebGL2 = true;
      perfStats.gpuSupported = true;
    }

    function pollGpuTimerQuery() {
      if (!gpuTimer.ext || !gpuTimer.pendingQueries.length) {
        return;
      }

      const gl = renderer.getContext();
      while (gpuTimer.pendingQueries.length > 0) {
        const query = gpuTimer.pendingQueries[0];
        const available = gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE);
        const disjoint = gl.getParameter(gpuTimer.ext.GPU_DISJOINT_EXT);
        if (!available || disjoint) {
          break;
        }

        const elapsedNanoseconds = gl.getQueryParameter(query, gl.QUERY_RESULT);
        gl.deleteQuery(query);
        gpuTimer.pendingQueries.shift();
        perfStats.gpuSamples += 1;
        recordPerfMetric('gpuRenderMs', elapsedNanoseconds / 1e6);
      }
    }

    function beginGpuTimerQuery() {
      if (!gpuTimer.ext || gpuTimer.activeQuery) {
        return;
      }

      const gl = renderer.getContext();
      gpuTimer.activeQuery = gl.createQuery();
      gl.beginQuery(gpuTimer.ext.TIME_ELAPSED_EXT, gpuTimer.activeQuery);
    }

    function endGpuTimerQuery() {
      if (!gpuTimer.ext || !gpuTimer.activeQuery) {
        return;
      }

      const gl = renderer.getContext();
      gl.endQuery(gpuTimer.ext.TIME_ELAPSED_EXT);
      gpuTimer.pendingQueries.push(gpuTimer.activeQuery);
      gpuTimer.activeQuery = null;
    }

    function resolveQualityProfile(count) {
      if (count >= ULTRA_COUNT_THRESHOLD) {
        return {
          id: 'ultra',
          label: 'ultra',
          pixelRatioCap: 0.75,
          renderScale: 0.82,
          simplifiedPetals: true,
          transparentPetals: false,
          depthWrite: true,
          defaultGroundBudget: 4096,
        };
      }

      if (count >= DENSE_COUNT_THRESHOLD) {
        return {
          id: 'dense',
          label: 'dense',
          pixelRatioCap: 0.9,
          renderScale: 0.9,
          simplifiedPetals: true,
          transparentPetals: false,
          depthWrite: true,
          defaultGroundBudget: 2048,
        };
      }

      return {
        id: 'standard',
        label: 'standard',
        pixelRatioCap: 2,
        renderScale: 1,
        simplifiedPetals: false,
        transparentPetals: true,
        depthWrite: false,
        defaultGroundBudget: DEFAULT_GROUND_UPLOAD_BATCH,
      };
    }

    function getRendererPixelRatio() {
      const devicePixelRatio = window.devicePixelRatio || 1;
      return Math.min(devicePixelRatio, currentQualityProfile.pixelRatioCap) * currentQualityProfile.renderScale;
    }

    function applyRendererQuality() {
      if (!renderer) {
        return;
      }
      renderer.setPixelRatio(getRendererPixelRatio());
    }

    function createBlossomUpload() {
      const values = new Float32Array(BLOSSOM_POSITIONS.length * 3);
      for (let i = 0; i < BLOSSOM_POSITIONS.length; i += 1) {
        const offset = i * 3;
        const position = BLOSSOM_POSITIONS[i];
        values[offset] = position.x;
        values[offset + 1] = position.y;
        values[offset + 2] = position.z;
      }
      return values;
    }

    function seedPetalsInWasm(count) {
      sakuraWasm.sim_init(count);
      const blossomUpload = createBlossomUpload();
      const ptr = sakuraWasm.alloc_f32(blossomUpload.length);
      new Float32Array(sakuraWasm.memory.buffer, ptr, blossomUpload.length).set(blossomUpload);
      sakuraWasm.sim_seed_petals((Math.random() * 0xffffffff) >>> 0 || 1, ptr, blossomUpload.length);
      sakuraWasm.free_f32(ptr, blossomUpload.length);
      refreshWasmViews();
    }

    function populateTreeLayerFromWasm() {
      for (let i = 0; i < wasmViews.count; i += 1) {
        writeVec3(
          treePetalLayer.arrays.baseOffset,
          i,
          wasmViews.treePosX[i],
          wasmViews.treePosY[i],
          wasmViews.treePosZ[i]
        );
        writeVec3(
          treePetalLayer.arrays.baseRotation,
          i,
          wasmViews.treeRotX[i],
          wasmViews.treeRotY[i],
          wasmViews.treeRotZ[i]
        );
        treePetalLayer.arrays.phase[i] = wasmViews.phase[i];
        treePetalLayer.arrays.scale[i] = wasmViews.scale[i];
        treePetalLayer.arrays.brightness[i] = wasmViews.brightness[i];
        treePetalLayer.slotToPetal[i] = i;
        treePetalLayer.petalToSlot[i] = i;
      }

      treePetalLayer.count = wasmViews.count;
      treePetalLayer.geometry.instanceCount = wasmViews.count;
      treePetalLayer.attributes.baseOffset.needsUpdate = true;
      treePetalLayer.attributes.baseRotation.needsUpdate = true;
      treePetalLayer.attributes.phase.needsUpdate = true;
      treePetalLayer.attributes.scale.needsUpdate = true;
      treePetalLayer.attributes.brightness.needsUpdate = true;
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(COLORS.fog, 16, 46);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 4.8, 10.8);
      camera.lookAt(0, 2.2, 0);

      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance',
      });
      applyRendererQuality();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.22;
      renderer.sortObjects = true;
      initGpuTimerQuery();

      controls = new OrbitControls(camera, renderer.domElement);
      controls.autoRotate = false;
      controls.autoRotateSpeed = AUTO_ROTATE_SPEED;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;
      controls.minDistance = 4;
      controls.maxDistance = 16;
      controls.target.set(0, 2.2, 0);
      controls.update();

      const ambientLight = new THREE.AmbientLight(COLORS.lightWarm, 0.95);
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.25);
      keyLight.position.set(5, 10, 5);
      const fillLight = new THREE.DirectionalLight(COLORS.lightCool, 0.52);
      fillLight.position.set(-3, 5, -3);

      scene.add(ambientLight, keyLight, fillLight);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', onKeyDown);
      document.addEventListener('fullscreenchange', onWindowResize);
    }

    function createBackdrop() {
      const geometry = new THREE.SphereGeometry(70, 40, 20);
      const material = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        uniforms: {
          topColor: { value: new THREE.Color(COLORS.backdropTop) },
          bottomColor: { value: new THREE.Color(COLORS.backdropBottom) },
        },
        vertexShader: `
          varying float vMix;

          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vMix = clamp(worldPosition.y / 36.0 + 0.5, 0.0, 1.0);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 bottomColor;
          varying float vMix;

          void main() {
            float mixValue = smoothstep(0.0, 1.0, vMix);
            vec3 color = mix(bottomColor, topColor, mixValue);
            color += vec3(0.03, 0.01, 0.02) * pow(1.0 - mixValue, 2.0);
            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });

      scene.add(new THREE.Mesh(geometry, material));
    }

    function createGround() {
      const grassMaterial = new THREE.MeshLambertMaterial({ color: COLORS.grass });
      const soilMaterial = new THREE.MeshLambertMaterial({ color: COLORS.soil });

      const capGeometry = new THREE.CylinderGeometry(3.2, 3.2, 0.02, 10);
      const capMesh = new THREE.Mesh(capGeometry, grassMaterial);
      capMesh.position.y = 0.31;
      scene.add(capMesh);

      const bodyGeometry = new THREE.CylinderGeometry(3.2, 3.8, 0.6, 10, 1, false);
      const bodyPosition = bodyGeometry.attributes.position;
      for (let i = 0; i < bodyPosition.count; i += 1) {
        const y = bodyPosition.getY(i);
        const offsetStrength = y < 0 ? 0.15 : 0.08;
        bodyPosition.setX(i, bodyPosition.getX(i) + (Math.random() - 0.5) * offsetStrength);
        bodyPosition.setZ(i, bodyPosition.getZ(i) + (Math.random() - 0.5) * offsetStrength);
      }
      bodyGeometry.computeVertexNormals();

      const bodyMesh = new THREE.Mesh(bodyGeometry, [soilMaterial, grassMaterial, soilMaterial]);
      bodyMesh.position.y = 0.01;
      scene.add(bodyMesh);

      const meadowGeometry = new THREE.PlaneGeometry(120, 120, 12, 12);
      const meadowPosition = meadowGeometry.attributes.position;
      for (let i = 0; i < meadowPosition.count; i += 1) {
        meadowPosition.setZ(i, meadowPosition.getZ(i) + (Math.random() - 0.5) * 0.4);
      }
      meadowGeometry.computeVertexNormals();

      const meadowMaterial = new THREE.MeshLambertMaterial({ color: COLORS.meadow });
      const meadow = new THREE.Mesh(meadowGeometry, meadowMaterial);
      meadow.rotation.x = -Math.PI / 2;
      meadow.position.y = GROUND_Y_OUTER;
      scene.add(meadow);

      const glowGeometry = new THREE.CircleGeometry(5.8, 40);
      const glowMaterial = new THREE.MeshBasicMaterial({
        color: COLORS.meadowShadow,
        transparent: true,
        opacity: 0.12,
        depthWrite: false,
      });
      const glow = new THREE.Mesh(glowGeometry, glowMaterial);
      glow.rotation.x = -Math.PI / 2;
      glow.position.y = GROUND_Y_OUTER + 0.01;
      scene.add(glow);
    }

    function flattenVertices(vertices) {
      const flat = [];
      for (let i = 0; i < vertices.length; i += 1) {
        const vertex = vertices[i];
        if (Array.isArray(vertex)) {
          flat.push(vertex[0], vertex[1], vertex[2]);
        } else {
          flat.push(vertex.x, vertex.y, vertex.z);
        }
      }
      return flat;
    }

    function flattenFaces(faces) {
      const flat = [];
      for (let i = 0; i < faces.length; i += 1) {
        const face = faces[i];
        if (Array.isArray(face)) {
          flat.push(face[0], face[1], face[2]);
        } else {
          flat.push(face.a, face.b, face.c);
        }
      }
      return flat;
    }

    function buildTreeGeometry(vertices, faces) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(flattenVertices(vertices), 3));
      geometry.setIndex(flattenFaces(faces));

      const position = geometry.attributes.position;
      for (let i = 0; i < position.count; i += 1) {
        const y = position.getY(i);
        const radialBoost = THREE.MathUtils.clamp(0.35 - y * 0.12, 0.0, 0.28);
        if (radialBoost > 0) {
          position.setX(i, position.getX(i) * (1 + radialBoost));
          position.setZ(i, position.getZ(i) * (1 + radialBoost));
        }
      }

      geometry.computeVertexNormals();
      return geometry;
    }

    function collectTwigPositions(tree) {
      const twigVertices = tree.twigVerts || tree.vertsTwig || [];
      BLOSSOM_POSITIONS.length = 0;

      for (let i = 0; i < twigVertices.length; i += 3) {
        const vertex = twigVertices[i];
        const x = Array.isArray(vertex) ? vertex[0] : vertex.x;
        const y = Array.isArray(vertex) ? vertex[1] : vertex.y;
        const z = Array.isArray(vertex) ? vertex[2] : vertex.z;
        BLOSSOM_POSITIONS.push(new THREE.Vector3(x, y + 0.3, z));
      }

      const extra = [];
      for (let i = 0; i < BLOSSOM_POSITIONS.length; i += 1) {
        const position = BLOSSOM_POSITIONS[i];
        for (let j = 0; j < 5; j += 1) {
          extra.push(new THREE.Vector3(
            position.x + (Math.random() - 0.5) * 0.28,
            position.y + (Math.random() - 0.5) * 0.16,
            position.z + (Math.random() - 0.5) * 0.28
          ));
        }
      }

      BLOSSOM_POSITIONS.push(...extra);
    }

    function createTree() {
      const treeParams = {
        clumpMax: 0.454,
        clumpMin: 0.404,
        lengthFalloffFactor: 0.85,
        lengthFalloffPower: 0.99,
        branchFactor: 2.8,
        radiusFalloffRate: 0.6,
        climbRate: 0.5,
        trunkKink: 0.09,
        maxRadius: 0.12,
        treeSteps: 5,
        taperRate: 0.95,
        twistRate: 3.02,
        segments: 6,
        levels: 4,
        sweepAmount: 0,
        initialBranchLength: 0.85,
        initalBranchLength: 0.85,
        trunkLength: 1.8,
        dropAmount: -0.1,
        growAmount: 0.235,
        vMultiplier: 0.36,
        twigScale: 0.35,
        seed: 262,
      };

      const tree = new window.Tree(treeParams);
      const trunkGeometry = buildTreeGeometry(tree.verts, tree.faces);
      const trunkMaterial = new THREE.MeshLambertMaterial({ color: COLORS.trunk });
      const trunkMesh = new THREE.Mesh(trunkGeometry, trunkMaterial);
      trunkMesh.position.y = 0.3;
      scene.add(trunkMesh);

      collectTwigPositions(tree);
    }

    function createRoots() {
      const rootMaterial = new THREE.MeshLambertMaterial({ color: COLORS.trunk });
      const rootGeometry = new THREE.CylinderGeometry(0.065, 0.02, 0.95, 5);
      const configs = [
        { x: 0.36, z: 0.15, ry: -0.7, rz: -1.05 },
        { x: -0.32, z: 0.26, ry: 0.4, rz: 1.08 },
        { x: 0.15, z: -0.36, ry: 0.2, rz: -0.88 },
        { x: -0.18, z: -0.42, ry: -0.55, rz: 0.92 },
      ];

      for (let i = 0; i < configs.length; i += 1) {
        const config = configs[i];
        const root = new THREE.Mesh(rootGeometry, rootMaterial);
        root.position.set(config.x, 0.17, config.z);
        root.rotation.y = config.ry;
        root.rotation.z = config.rz;
        scene.add(root);
      }
    }

    function createRocks() {
      const configs = [
        { x: 0.8, z: 0.5, sx: 0.35, sy: 0.28, sz: 0.32, ry: 0.3 },
        { x: -0.5, z: 0.8, sx: 0.28, sy: 0.22, sz: 0.30, ry: 1.1 },
        { x: 0.3, z: -0.7, sx: 0.42, sy: 0.25, sz: 0.35, ry: 2.2 },
        { x: -0.9, z: -0.3, sx: 0.20, sy: 0.18, sz: 0.22, ry: 0.8 },
      ];

      for (let i = 0; i < configs.length; i += 1) {
        const config = configs[i];
        const geometry = new THREE.IcosahedronGeometry(0.5, 1);
        const position = geometry.attributes.position;
        for (let j = 0; j < position.count; j += 1) {
          position.setX(j, position.getX(j) + (Math.random() - 0.5) * 0.15);
          position.setY(j, position.getY(j) + (Math.random() - 0.5) * 0.10);
          position.setZ(j, position.getZ(j) + (Math.random() - 0.5) * 0.15);
        }
        geometry.computeVertexNormals();

        const brightness = 0.65 + Math.random() * 0.2;
        const material = new THREE.MeshLambertMaterial({
          color: new THREE.Color(brightness, brightness, brightness),
        });
        const rock = new THREE.Mesh(geometry, material);
        rock.position.set(config.x, 0.28 + config.sy * 0.3, config.z);
        rock.rotation.y = config.ry;
        rock.scale.set(config.sx, config.sy, config.sz);
        scene.add(rock);
      }
    }

    function createDensePetalGeometry() {
      const width = PETAL_SIZE * 0.95;
      const height = PETAL_SIZE * 1.18;
      const positions = new Float32Array([
        0.0, height * 0.58, 0.0,
        -width * 0.52, height * 0.08, 0.0,
        0.0, -height * 0.62, 0.0,
        width * 0.52, height * 0.08, 0.0,
      ]);
      const uvs = new Float32Array([
        0.5, 1.0,
        0.0, 0.56,
        0.5, 0.0,
        1.0, 0.56,
      ]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex([0, 1, 2, 0, 2, 3]);
      return geometry;
    }

    function createInstancedPetalGeometry() {
      const base = currentQualityProfile.simplifiedPetals
        ? createDensePetalGeometry()
        : new THREE.PlaneGeometry(PETAL_SIZE * 1.45, PETAL_SIZE);
      const geometry = new THREE.InstancedBufferGeometry().copy(base);
      base.dispose();
      return geometry;
    }

    function createPetalMaterial(color, vertexShader, extraUniforms = {}) {
      return new THREE.ShaderMaterial({
        uniforms: {
          color: { value: new THREE.Color(color) },
          ...extraUniforms,
        },
        vertexShader,
        fragmentShader: currentQualityProfile.simplifiedPetals ? DENSE_PETAL_FRAGMENT_SHADER : PETAL_FRAGMENT_SHADER,
        transparent: currentQualityProfile.transparentPetals,
        side: THREE.DoubleSide,
        depthWrite: currentQualityProfile.depthWrite,
      });
    }

    function writeVec3(array, index, x, y, z) {
      const offset = index * 3;
      array[offset] = x;
      array[offset + 1] = y;
      array[offset + 2] = z;
    }

    function markAttributeRange(attribute, start, count) {
      if (!attribute || count <= 0) {
        return;
      }

      if (typeof attribute.clearUpdateRanges === 'function') {
        attribute.clearUpdateRanges();
      }

      if (typeof attribute.addUpdateRange === 'function') {
        attribute.addUpdateRange(start, count);
      } else if (attribute.updateRange) {
        attribute.updateRange.offset = start;
        attribute.updateRange.count = count;
      }

      attribute.needsUpdate = true;
    }

    function clearAttributeRanges(attribute) {
      if (!attribute) {
        return;
      }

      if (typeof attribute.clearUpdateRanges === 'function') {
        attribute.clearUpdateRanges();
      } else if (attribute.updateRange) {
        attribute.updateRange.offset = 0;
        attribute.updateRange.count = -1;
      }
    }

    function appendAttributeRange(attribute, start, count) {
      if (!attribute || count <= 0) {
        return;
      }

      if (typeof attribute.addUpdateRange === 'function') {
        attribute.addUpdateRange(start, count);
      } else if (attribute.updateRange) {
        if (attribute.updateRange.count < 0) {
          attribute.updateRange.offset = start;
          attribute.updateRange.count = count;
        } else {
          const rangeStart = Math.min(attribute.updateRange.offset, start);
          const rangeEnd = Math.max(attribute.updateRange.offset + attribute.updateRange.count, start + count);
          attribute.updateRange.offset = rangeStart;
          attribute.updateRange.count = rangeEnd - rangeStart;
        }
      }

      attribute.needsUpdate = true;
    }

    function buildTreePetalLayer(count) {
      const geometry = createInstancedPetalGeometry();
      geometry.instanceCount = count;

      const baseOffset = new Float32Array(count * 3);
      const baseRotation = new Float32Array(count * 3);
      const phase = new Float32Array(count);
      const scale = new Float32Array(count);
      const brightness = new Float32Array(count);
      const slotToPetal = new Uint32Array(count);
      const petalToSlot = new Uint32Array(count);

      const baseOffsetAttr = new THREE.InstancedBufferAttribute(baseOffset, 3);
      const baseRotationAttr = new THREE.InstancedBufferAttribute(baseRotation, 3);
      const phaseAttr = new THREE.InstancedBufferAttribute(phase, 1);
      const scaleAttr = new THREE.InstancedBufferAttribute(scale, 1);
      const brightnessAttr = new THREE.InstancedBufferAttribute(brightness, 1);

      baseOffsetAttr.setUsage(THREE.DynamicDrawUsage);
      baseRotationAttr.setUsage(THREE.DynamicDrawUsage);
      phaseAttr.setUsage(THREE.DynamicDrawUsage);
      scaleAttr.setUsage(THREE.DynamicDrawUsage);
      brightnessAttr.setUsage(THREE.DynamicDrawUsage);

      geometry.setAttribute('baseOffset', baseOffsetAttr);
      geometry.setAttribute('baseRotation', baseRotationAttr);
      geometry.setAttribute('aPhase', phaseAttr);
      geometry.setAttribute('aScale', scaleAttr);
      geometry.setAttribute('aBrightness', brightnessAttr);

      const material = createPetalMaterial(COLORS.petal, TREE_VERTEX_SHADER, {
        time: { value: 0 },
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.frustumCulled = false;
      mesh.renderOrder = 4;

      return {
        mesh,
        geometry,
        material,
        count,
        arrays: { baseOffset, baseRotation, phase, scale, brightness },
        slotToPetal,
        petalToSlot,
        attributes: {
          baseOffset: baseOffsetAttr,
          baseRotation: baseRotationAttr,
          phase: phaseAttr,
          scale: scaleAttr,
          brightness: brightnessAttr,
        },
      };
    }

    function buildDynamicPetalLayer(count, color, renderOrder) {
      const geometry = createInstancedPetalGeometry();
      geometry.instanceCount = 0;

      const offsets = new Float32Array(count * 3);
      const rotations = new Float32Array(count * 3);
      const scales = new Float32Array(count);
      const brightness = new Float32Array(count);

      const offsetAttr = new THREE.InstancedBufferAttribute(offsets, 3);
      const rotationAttr = new THREE.InstancedBufferAttribute(rotations, 3);
      const scaleAttr = new THREE.InstancedBufferAttribute(scales, 1);
      const brightnessAttr = new THREE.InstancedBufferAttribute(brightness, 1);

      offsetAttr.setUsage(THREE.DynamicDrawUsage);
      rotationAttr.setUsage(THREE.DynamicDrawUsage);
      scaleAttr.setUsage(THREE.DynamicDrawUsage);
      brightnessAttr.setUsage(THREE.DynamicDrawUsage);

      geometry.setAttribute('aOffset', offsetAttr);
      geometry.setAttribute('aRotation', rotationAttr);
      geometry.setAttribute('aScale', scaleAttr);
      geometry.setAttribute('aBrightness', brightnessAttr);

      const material = createPetalMaterial(color, DYNAMIC_VERTEX_SHADER);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.frustumCulled = false;
      mesh.renderOrder = renderOrder;

      return {
        mesh,
        geometry,
        material,
        count: 0,
        arrays: { offsets, rotations, scales, brightness },
        attributes: {
          offsets: offsetAttr,
          rotations: rotationAttr,
          scales: scaleAttr,
          brightness: brightnessAttr,
        },
      };
    }

    function disposePetals() {
      const layers = [treePetalLayer, fallingPetalLayer, groundPetalLayer];
      for (let i = 0; i < layers.length; i += 1) {
        const layer = layers[i];
        if (!layer) {
          continue;
        }
        scene.remove(layer.mesh);
        layer.geometry.dispose();
        layer.material.dispose();
      }

      treePetalLayer = null;
      fallingPetalLayer = null;
      groundPetalLayer = null;
    }

    function createPetals(count) {
      disposePetals();
      currentQualityProfile = resolveQualityProfile(count);
      groundUploadBudget = currentQualityProfile.defaultGroundBudget;
      applyRendererQuality();

      treePetalLayer = buildTreePetalLayer(count);
      groundPetalLayer = buildDynamicPetalLayer(count, COLORS.petalGround, 2);
      fallingPetalLayer = buildDynamicPetalLayer(count, COLORS.petal, 5);
      groundLandingQueue = new Uint32Array(count);
      groundLandingQueueHead = 0;
      groundLandingQueueTail = 0;
      groundLandingQueueCount = 0;

      scene.add(groundPetalLayer.mesh, treePetalLayer.mesh, fallingPetalLayer.mesh);
      seedPetalsInWasm(count);
      populateTreeLayerFromWasm();

      fallingPetalLayer.count = 0;
      fallingPetalLayer.geometry.instanceCount = 0;
      groundPetalLayer.count = 0;
      groundPetalLayer.geometry.instanceCount = 0;

      stats.onTree = count;
      stats.falling = 0;
      stats.onGround = 0;
      resetPerfStats();
    }

    function copyTreePetalSlot(fromSlot, toSlot) {
      if (fromSlot === toSlot) {
        return;
      }

      const sourceOffset = fromSlot * 3;
      const targetOffset = toSlot * 3;
      treePetalLayer.arrays.baseOffset[targetOffset] = treePetalLayer.arrays.baseOffset[sourceOffset];
      treePetalLayer.arrays.baseOffset[targetOffset + 1] = treePetalLayer.arrays.baseOffset[sourceOffset + 1];
      treePetalLayer.arrays.baseOffset[targetOffset + 2] = treePetalLayer.arrays.baseOffset[sourceOffset + 2];
      treePetalLayer.arrays.baseRotation[targetOffset] = treePetalLayer.arrays.baseRotation[sourceOffset];
      treePetalLayer.arrays.baseRotation[targetOffset + 1] = treePetalLayer.arrays.baseRotation[sourceOffset + 1];
      treePetalLayer.arrays.baseRotation[targetOffset + 2] = treePetalLayer.arrays.baseRotation[sourceOffset + 2];
      treePetalLayer.arrays.phase[toSlot] = treePetalLayer.arrays.phase[fromSlot];
      treePetalLayer.arrays.scale[toSlot] = treePetalLayer.arrays.scale[fromSlot];
      treePetalLayer.arrays.brightness[toSlot] = treePetalLayer.arrays.brightness[fromSlot];
    }

    function removeTreePetal(index) {
      const slot = treePetalLayer.petalToSlot[index];
      if (slot === 0xffffffff || treePetalLayer.count <= 0) {
        return -1;
      }

      const lastSlot = treePetalLayer.count - 1;
      if (slot !== lastSlot) {
        const movedPetal = treePetalLayer.slotToPetal[lastSlot];
        copyTreePetalSlot(lastSlot, slot);
        treePetalLayer.slotToPetal[slot] = movedPetal;
        treePetalLayer.petalToSlot[movedPetal] = slot;
      }

      treePetalLayer.petalToSlot[index] = 0xffffffff;
      treePetalLayer.slotToPetal[lastSlot] = 0xffffffff;
      treePetalLayer.count = lastSlot;
      treePetalLayer.geometry.instanceCount = lastSlot;
      return slot === lastSlot ? -1 : slot;
    }

    function queueGroundPetals(landedCount) {
      if (landedCount <= 0) {
        return;
      }

      for (let i = 0; i < landedCount; i += 1) {
        groundLandingQueue[groundLandingQueueTail] = wasmViews.landedIndices[i];
        groundLandingQueueTail = (groundLandingQueueTail + 1) % groundLandingQueue.length;
      }

      groundLandingQueueCount += landedCount;
      perfStats.queuePeak = Math.max(perfStats.queuePeak, groundLandingQueueCount);
    }

    function flushGroundQueue(maxBatch = groundUploadBudget) {
      const flushCount = Math.min(groundLandingQueueCount, maxBatch);
      perfStats.lastGroundFlushCount = 0;
      if (flushCount <= 0) {
        return 0;
      }

      const startSlot = groundPetalLayer.count;
      for (let i = 0; i < flushCount; i += 1) {
        const slot = startSlot + i;
        const index = groundLandingQueue[groundLandingQueueHead];
        groundLandingQueueHead = (groundLandingQueueHead + 1) % groundLandingQueue.length;
        writeVec3(
          groundPetalLayer.arrays.offsets,
          slot,
          wasmViews.posX[index],
          wasmViews.posY[index],
          wasmViews.posZ[index]
        );
        writeVec3(
          groundPetalLayer.arrays.rotations,
          slot,
          wasmViews.rotX[index],
          wasmViews.rotY[index],
          wasmViews.rotZ[index]
        );
        groundPetalLayer.arrays.scales[slot] = wasmViews.scale[index];
        groundPetalLayer.arrays.brightness[slot] = Math.max(0.76, wasmViews.brightness[index] * 0.88);
      }

      groundLandingQueueCount -= flushCount;

      groundPetalLayer.count += flushCount;
      groundPetalLayer.geometry.instanceCount = groundPetalLayer.count;
      markAttributeRange(groundPetalLayer.attributes.offsets, startSlot * 3, flushCount * 3);
      markAttributeRange(groundPetalLayer.attributes.rotations, startSlot * 3, flushCount * 3);
      markAttributeRange(groundPetalLayer.attributes.scales, startSlot, flushCount);
      markAttributeRange(groundPetalLayer.attributes.brightness, startSlot, flushCount);
      perfStats.lastGroundFlushCount = flushCount;
      return flushCount;
    }

    function syncFallingLayerFromWasm() {
      const activeCount = sakuraWasm.sim_active_count();
      for (let slot = 0; slot < activeCount; slot += 1) {
        const index = wasmViews.activeIndices[slot];
        writeVec3(
          fallingPetalLayer.arrays.offsets,
          slot,
          wasmViews.posX[index],
          wasmViews.posY[index],
          wasmViews.posZ[index]
        );
        writeVec3(
          fallingPetalLayer.arrays.rotations,
          slot,
          wasmViews.rotX[index],
          wasmViews.rotY[index],
          wasmViews.rotZ[index]
        );
        fallingPetalLayer.arrays.scales[slot] = wasmViews.scale[index];
        fallingPetalLayer.arrays.brightness[slot] = wasmViews.brightness[index];
      }

      fallingPetalLayer.count = activeCount;
      fallingPetalLayer.geometry.instanceCount = activeCount;
      markAttributeRange(fallingPetalLayer.attributes.offsets, 0, activeCount * 3);
      markAttributeRange(fallingPetalLayer.attributes.rotations, 0, activeCount * 3);
      markAttributeRange(fallingPetalLayer.attributes.scales, 0, activeCount);
      markAttributeRange(fallingPetalLayer.attributes.brightness, 0, activeCount);
      perfStats.activePeak = Math.max(perfStats.activePeak, activeCount);
      return activeCount;
    }

    function updatePetals(time) {
      let treeUploadBytes = 0;

      const activateStart = performance.now();
      const activatedCount = sakuraWasm.sim_activate_ready_petals(frameCount, time);
      recordPerfMetric('wasmActivateMs', performance.now() - activateStart);

      clearAttributeRanges(treePetalLayer.attributes.baseOffset);
      clearAttributeRanges(treePetalLayer.attributes.baseRotation);
      clearAttributeRanges(treePetalLayer.attributes.phase);
      clearAttributeRanges(treePetalLayer.attributes.scale);
      clearAttributeRanges(treePetalLayer.attributes.brightness);

      for (let i = 0; i < activatedCount; i += 1) {
        const index = wasmViews.activatedIndices[i];
        const changedSlot = removeTreePetal(index);
        if (changedSlot < 0) {
          continue;
        }

        appendAttributeRange(treePetalLayer.attributes.baseOffset, changedSlot * 3, 3);
        appendAttributeRange(treePetalLayer.attributes.baseRotation, changedSlot * 3, 3);
        appendAttributeRange(treePetalLayer.attributes.phase, changedSlot, 1);
        appendAttributeRange(treePetalLayer.attributes.scale, changedSlot, 1);
        appendAttributeRange(treePetalLayer.attributes.brightness, changedSlot, 1);
        treeUploadBytes += TREE_UPLOAD_BYTES_PER_INSTANCE;
      }

      const fallingStepStart = performance.now();
      const landedCount = sakuraWasm.sim_step_falling(
        FIXED_DT,
        time,
        PARAMS.windStrength,
        PARAMS.gravity,
        PARAMS.airResistance,
        ISLAND_RADIUS,
        GROUND_Y,
        GROUND_Y_OUTER
      );
      recordPerfMetric('wasmStepMs', performance.now() - fallingStepStart);

      const queueStart = performance.now();
      queueGroundPetals(landedCount);
      const flushedGroundCount = flushGroundQueue();
      recordPerfMetric('groundQueueMs', performance.now() - queueStart);

      const fallingUploadStart = performance.now();
      const activeCount = syncFallingLayerFromWasm();
      recordPerfMetric('fallingUploadMs', performance.now() - fallingUploadStart);
      treePetalLayer.material.uniforms.time.value = time;

      perfStats.lastActivatedCount = activatedCount;
      perfStats.lastLandedCount = landedCount;
      perfStats.treePeak = Math.max(perfStats.treePeak, treePetalLayer.count);
      perfStats.treeUploadBytesPerFrame = treeUploadBytes;
      perfStats.fallingUploadBytesPerFrame = activeCount * DYNAMIC_UPLOAD_BYTES_PER_INSTANCE;
      perfStats.groundUploadBytesPerFrame = flushedGroundCount * DYNAMIC_UPLOAD_BYTES_PER_INSTANCE;
      recordPerfMetric(
        'uploadedBytesPerFrame',
        treeUploadBytes + perfStats.fallingUploadBytesPerFrame + perfStats.groundUploadBytesPerFrame
      );

      stats.falling = activeCount;
      stats.onGround += landedCount;
      stats.onTree = treePetalLayer.count;
      updatePerfBottleneck();
    }

    function step(deltaSeconds) {
      const frameStart = performance.now();
      simTime += deltaSeconds;
      frameCount += 1;
      controls.update();
      updatePetals(simTime);
      recordPerfMetric('frameCpuMs', performance.now() - frameStart);
      refreshHud();
    }

    function render() {
      pollGpuTimerQuery();
      const renderStart = performance.now();
      beginGpuTimerQuery();
      renderer.render(scene, camera);
      endGpuTimerQuery();
      recordPerfMetric('renderCpuMs', performance.now() - renderStart);
    }

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = Math.min(0.05, (now - lastFrameTime) * 0.001);
      lastFrameTime = now;
      accumulator += delta;

      while (accumulator >= FIXED_DT) {
        step(FIXED_DT);
        accumulator -= FIXED_DT;
      }

      render();
      updateFps(now);
    }

    function updateFps(now) {
      fpsFrameCounter += 1;
      if (now - fpsStamp >= 1000) {
        fpsValue = Math.round((fpsFrameCounter * 1000) / (now - fpsStamp));
        fpsFrameCounter = 0;
        fpsStamp = now;
        refreshHud();
      }
    }

    function roundValue(value) {
      return Math.round(value * 100) / 100;
    }

    function refreshHud() {
      const gpuLabel = perfStats.gpuSupported && perfStats.gpuRenderMs !== null
        ? `${roundValue(perfStats.gpuRenderMs)}ms`
        : 'n/a';
      const uploadKilobytes = Math.round(perfStats.uploadedBytesPerFrame / 1024);
      statsEl.textContent = [
        `fps ${fpsValue} | petals ${currentPetalCount} | 木 ${stats.onTree} | 落下 ${stats.falling} | 地面 ${stats.onGround}`,
        `cpu ${roundValue(perfStats.frameCpuMs)}ms | render ${roundValue(perfStats.renderCpuMs)}ms | gpu ${gpuLabel} | upload ${uploadKilobytes}KB | mode ${currentQualityProfile.label} | bottleneck ${perfStats.bottleneck}`,
      ].join('\n');
    }

    function clampPetalCount(value) {
      const numeric = Number.isFinite(value) ? value : DEFAULT_PETAL_COUNT;
      const stepped = Math.round(numeric / PETAL_STEP) * PETAL_STEP;
      return THREE.MathUtils.clamp(stepped, MIN_PETAL_COUNT, MAX_PETAL_COUNT);
    }

    function getInitialPetalCount() {
      const params = new URLSearchParams(window.location.search);
      const urlValue = Number.parseInt(params.get('petals') || '', 10);
      return clampPetalCount(urlValue);
    }

    function syncPetalInputs(value) {
      petalRangeEl.value = String(value);
      petalNumberEl.value = String(value);
    }

    function resetSimulationState() {
      simTime = 0;
      frameCount = 0;
      accumulator = 0;
      lastFrameTime = performance.now();
      fpsFrameCounter = 0;
      fpsStamp = performance.now();
      fpsValue = 0;
      stats.onTree = currentPetalCount;
      stats.falling = 0;
      stats.onGround = 0;
      groundLandingQueueHead = 0;
      groundLandingQueueTail = 0;
      groundLandingQueueCount = 0;
      resetPerfStats();
    }

    function setPetalCount(nextCount) {
      currentPetalCount = clampPetalCount(nextCount);
      syncPetalInputs(currentPetalCount);
      resetSimulationState();
      createPetals(currentPetalCount);
      const url = new URL(window.location.href);
      url.searchParams.set('petals', String(currentPetalCount));
      history.replaceState(null, '', url);
      refreshHud();
      render();
      return currentPetalCount;
    }

    function setGroundUploadBudget(nextBudget) {
      const numeric = Number.isFinite(nextBudget) ? Math.floor(nextBudget) : DEFAULT_GROUND_UPLOAD_BATCH;
      groundUploadBudget = THREE.MathUtils.clamp(numeric, 1, MAX_GROUND_UPLOAD_BATCH);
      flushGroundQueue();
      refreshHud();
      render();
      return groundUploadBudget;
    }

    function initPetalControls() {
      syncPetalInputs(currentPetalCount);

      petalRangeEl.addEventListener('input', () => {
        syncPetalInputs(clampPetalCount(Number.parseInt(petalRangeEl.value, 10)));
      });
      petalRangeEl.addEventListener('change', () => {
        setPetalCount(Number.parseInt(petalRangeEl.value, 10));
      });

      petalNumberEl.addEventListener('change', () => {
        setPetalCount(Number.parseInt(petalNumberEl.value, 10));
      });

      presetButtonEls.forEach((button) => {
        button.addEventListener('click', () => {
          setPetalCount(Number.parseInt(button.dataset.petals, 10));
        });
      });
    }

    function renderGameToText() {
      const fallingSample = [];
      const activeCount = sakuraWasm.sim_active_count();
      for (let i = 0; i < activeCount && fallingSample.length < 8; i += 1) {
        const index = wasmViews.activeIndices[i];
        fallingSample.push({
          x: roundValue(wasmViews.posX[index]),
          y: roundValue(wasmViews.posY[index]),
          z: roundValue(wasmViews.posZ[index]),
        });
      }

      return JSON.stringify({
        coordinateSystem: 'origin=(0,0,0), +x=right, +y=up, +z=toward initial camera',
        time: roundValue(simTime),
        petals: {
          total: currentPetalCount,
          onTree: stats.onTree,
          falling: stats.falling,
          onGround: stats.onGround,
        },
        camera: {
          x: roundValue(camera.position.x),
          y: roundValue(camera.position.y),
          z: roundValue(camera.position.z),
        },
        target: {
          x: roundValue(controls.target.x),
          y: roundValue(controls.target.y),
          z: roundValue(controls.target.z),
        },
        layers: {
          treeInstances: treePetalLayer?.geometry.instanceCount ?? 0,
          fallingInstances: fallingPetalLayer?.geometry.instanceCount ?? 0,
          groundInstances: groundPetalLayer?.geometry.instanceCount ?? 0,
          pendingGroundUploads: groundLandingQueueCount,
          groundUploadBudget,
          queueCapacity: groundLandingQueue.length,
          qualityMode: currentQualityProfile.id,
          rendererPixelRatio: roundValue(renderer.getPixelRatio()),
        },
        perf: {
          bottleneck: perfStats.bottleneck,
          frameCpuMs: roundValue(perfStats.frameCpuMs),
          renderCpuMs: roundValue(perfStats.renderCpuMs),
          gpuRenderMs: perfStats.gpuRenderMs === null ? null : roundValue(perfStats.gpuRenderMs),
          wasmActivateMs: roundValue(perfStats.wasmActivateMs),
          wasmStepMs: roundValue(perfStats.wasmStepMs),
          groundQueueMs: roundValue(perfStats.groundQueueMs),
          fallingUploadMs: roundValue(perfStats.fallingUploadMs),
          uploadedKBPerFrame: Math.round(perfStats.uploadedBytesPerFrame / 1024),
          treeUploadKBPerFrame: Math.round(perfStats.treeUploadBytesPerFrame / 1024),
          fallingUploadKBPerFrame: Math.round(perfStats.fallingUploadBytesPerFrame / 1024),
          groundUploadKBPerFrame: Math.round(perfStats.groundUploadBytesPerFrame / 1024),
          gpuSupported: perfStats.gpuSupported,
          gpuSamples: perfStats.gpuSamples,
          activePeak: perfStats.activePeak,
          queuePeak: perfStats.queuePeak,
          lastActivatedCount: perfStats.lastActivatedCount,
          lastLandedCount: perfStats.lastLandedCount,
          lastGroundFlushCount: perfStats.lastGroundFlushCount,
        },
        fullscreen: Boolean(document.fullscreenElement),
        fallingSample,
      });
    }

    function advanceTime(ms) {
      const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
      accumulator = 0;
      for (let i = 0; i < steps; i += 1) {
        step(FIXED_DT);
      }
      render();
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      applyRendererQuality();
      render();
    }

    function onKeyDown(event) {
      if (event.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen?.();
      } else {
        document.documentElement.requestFullscreen?.();
      }
    }
  </script>
</body>
