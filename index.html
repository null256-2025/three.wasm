<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Demo</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light;
      --sky-1: #87ceeb;
      --sky-2: #cfefff;
      --panel: rgba(255, 248, 240, 0.18);
      --panel-border: rgba(255, 255, 255, 0.25);
      --panel-shadow: rgba(51, 27, 15, 0.18);
      --ink: #1d1b22;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.85), transparent 24%),
        radial-gradient(circle at 78% 12%, rgba(255, 255, 255, 0.55), transparent 22%),
        linear-gradient(180deg, var(--sky-2), var(--sky-1) 52%, #8fc65c 100%);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 18px 45px var(--panel-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      color: #fff;
    }

    #title {
      max-width: 390px;
      padding: 16px 18px;
    }

    #title h1 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #title p {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      opacity: 0.95;
    }

    #hud {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    #fps {
      padding: 10px 14px;
      min-width: 76px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    #hint {
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.45;
      max-width: 260px;
      color: rgba(255, 255, 255, 0.92);
    }

    @media (max-width: 720px) {
      #ui {
        padding: 12px;
        flex-direction: column;
        justify-content: space-between;
      }

      #title {
        max-width: none;
      }

      #hud {
        margin-top: auto;
        align-self: flex-end;
        flex-direction: column;
        align-items: flex-end;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <div id="title" class="panel">
      <h1>Sakura Demo</h1>
      <p>Orbit around the tree. The petals are instanced, wind-driven, and respawn after they settle.</p>
    </div>
    <div id="hud">
      <div id="fps" class="panel">0 fps</div>
      <div id="hint" class="panel">Drag to orbit. Wheel to zoom. The scene is a single HTML file with no build step.</div>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('scene');
    const fpsEl = document.getElementById('fps');

    const CONFIG = {
      petalCount: 500,
      gravity: 0.0008,
      windStrength: 0.003,
      airResistance: 0.98,
      fallSpeedMin: 0.008,
      fallSpeedMax: 0.015,
      groundY: 0.01,
      autoRotateSpeed: 0.3,
    };

    const blossomColors = [0xf7c2d4, 0xf4a0c0, 0xe8709a];
    const treeSpawnAnchors = [];
    const petals = [];
    const dummy = new THREE.Object3D();
    const clock = new THREE.Clock();
    let fpsFrames = 0;
    let fpsStamp = performance.now();

    let scene;
    let camera;
    let renderer;
    let controls;
    let petalMesh;

    initScene();
    createGround();
    createTree();
    createRocks();
    createPetals(CONFIG.petalCount);
    onWindowResize();
    animate();

    window.addEventListener('resize', onWindowResize);

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 18, 48);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 4, 8);
      camera.lookAt(0, 1.5, 0);

      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.5, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.minDistance = 3;
      controls.maxDistance = 15;
      controls.autoRotate = true;
      controls.autoRotateSpeed = CONFIG.autoRotateSpeed;
      controls.update();

      const ambient = new THREE.AmbientLight(0xfff8f0, 0.8);
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
      keyLight.position.set(5, 10, 5);
      const rimLight = new THREE.DirectionalLight(0xc8e8ff, 0.4);
      rimLight.position.set(-3, 5, -3);

      scene.add(ambient, keyLight, rimLight);
    }

    function createGround() {
      const root = new THREE.Group();
      scene.add(root);

      const grass = new THREE.Mesh(
        new THREE.PlaneGeometry(70, 70, 1, 1),
        new THREE.MeshStandardMaterial({
          color: 0x6aaa40,
          roughness: 1,
          metalness: 0,
        })
      );
      grass.rotation.x = -Math.PI / 2;
      grass.position.y = 0;
      root.add(grass);

      const soil = new THREE.Mesh(
        new THREE.CylinderGeometry(4.8, 5.4, 0.06, 40),
        new THREE.MeshStandardMaterial({
          color: 0x3d1c0f,
          roughness: 1,
          metalness: 0,
        })
      );
      soil.position.y = 0.02;
      root.add(soil);

      const mound = new THREE.Mesh(
        new THREE.CylinderGeometry(3.1, 4.1, 0.18, 40),
        new THREE.MeshStandardMaterial({
          color: 0x5b8d32,
          roughness: 1,
          metalness: 0,
        })
      );
      mound.position.y = 0.09;
      root.add(mound);
    }

    function createTree() {
      const tree = new THREE.Group();
      tree.rotation.y = -0.35;
      scene.add(tree);

      const barkMaterial = new THREE.MeshStandardMaterial({
        color: 0x3d1c0f,
        roughness: 1,
        metalness: 0,
      });

      const branchMaterial = new THREE.MeshStandardMaterial({
        color: 0x5c341f,
        roughness: 1,
        metalness: 0,
      });

      const blossomMaterials = blossomColors.map(
        (color) =>
          new THREE.MeshStandardMaterial({
            color,
            roughness: 0.95,
            metalness: 0,
          })
      );

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.24, 0.36, 3.6, 8),
        barkMaterial
      );
      trunk.position.set(0, 1.8, 0);
      trunk.rotation.z = -0.02;
      trunk.rotation.x = 0.02;
      tree.add(trunk);

      const branchA = new THREE.Mesh(
        new THREE.CylinderGeometry(0.09, 0.13, 1.9, 7),
        branchMaterial
      );
      branchA.position.set(0.75, 2.65, 0.18);
      branchA.rotation.set(-0.4, 0.15, -1.05);
      tree.add(branchA);

      const branchB = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.12, 1.65, 7),
        branchMaterial
      );
      branchB.position.set(-0.72, 2.85, -0.08);
      branchB.rotation.set(0.35, -0.1, 1.0);
      tree.add(branchB);

      const branchC = new THREE.Mesh(
        new THREE.CylinderGeometry(0.07, 0.1, 1.4, 7),
        branchMaterial
      );
      branchC.position.set(0.15, 3.25, 0.42);
      branchC.rotation.set(-0.3, 0.1, -0.5);
      tree.add(branchC);

      addBlossomCluster(tree, 0.08, 4.25, 0.05, 0.95, blossomMaterials);
      addBlossomCluster(tree, -1.08, 3.2, 0.34, 0.8, blossomMaterials);
      addBlossomCluster(tree, 0.95, 3.05, -0.18, 0.86, blossomMaterials);
      addBlossomCluster(tree, 0.42, 3.72, 0.78, 0.72, blossomMaterials);
      addBlossomCluster(tree, -0.18, 4.05, -0.42, 0.62, blossomMaterials);

      treeSpawnAnchors.push(
        { x: 0.08, y: 4.25, z: 0.05, spread: 0.95 },
        { x: -1.08, y: 3.2, z: 0.34, spread: 0.8 },
        { x: 0.95, y: 3.05, z: -0.18, spread: 0.86 },
        { x: 0.42, y: 3.72, z: 0.78, spread: 0.72 },
        { x: -0.18, y: 4.05, z: -0.42, spread: 0.62 }
      );
    }

    function addBlossomCluster(parent, x, y, z, radius, materials) {
      const cluster = new THREE.Group();
      cluster.position.set(x, y, z);

      const blossomGeometry = new THREE.SphereGeometry(0.25, 10, 10);
      const center = new THREE.Mesh(blossomGeometry, materials[1]);
      center.scale.setScalar(radius * 1.1);
      cluster.add(center);

      const petalsAround = [
        [0.28, 0.05, 0.0, 0.9],
        [-0.23, -0.03, 0.08, 0.86],
        [0.0, 0.22, 0.08, 0.82],
        [0.0, -0.18, -0.05, 0.8],
        [0.16, 0.14, 0.16, 0.78],
        [-0.16, 0.1, -0.14, 0.76],
      ];

      for (let i = 0; i < petalsAround.length; i++) {
        const [dx, dy, dz, scale] = petalsAround[i];
        const blossom = new THREE.Mesh(
          blossomGeometry,
          materials[i % materials.length]
        );
        blossom.position.set(dx * radius, dy * radius, dz * radius);
        blossom.scale.setScalar(radius * scale);
        cluster.add(blossom);
      }

      parent.add(cluster);
    }

    function createRocks() {
      const rockMaterial = new THREE.MeshStandardMaterial({
        color: 0x909090,
        roughness: 1,
        metalness: 0,
      });

      const rockGeometry = new THREE.IcosahedronGeometry(0.38, 0);
      const placements = [
        { x: -2.4, y: 0.17, z: 1.9, sx: 1.15, sy: 0.8, sz: 1.0, rx: 0.3, ry: 0.5, rz: -0.1 },
        { x: 2.1, y: 0.14, z: 1.4, sx: 0.9, sy: 0.72, sz: 1.12, rx: -0.1, ry: 0.8, rz: 0.2 },
        { x: 1.1, y: 0.12, z: -2.1, sx: 1.05, sy: 0.76, sz: 0.92, rx: 0.2, ry: -0.6, rz: 0.15 },
        { x: -1.3, y: 0.11, z: -1.8, sx: 0.82, sy: 0.66, sz: 1.05, rx: -0.2, ry: 0.2, rz: -0.25 },
      ];

      for (let i = 0; i < placements.length; i++) {
        const p = placements[i];
        const rock = new THREE.Mesh(rockGeometry, rockMaterial);
        rock.position.set(p.x, p.y, p.z);
        rock.rotation.set(p.rx, p.ry, p.rz);
        rock.scale.set(p.sx, p.sy, p.sz);
        scene.add(rock);
      }
    }

    function createPetalGeometry() {
      const geometry = new THREE.BufferGeometry();
      const width = 0.12;
      const height = 0.1;
      const vertices = new Float32Array([
        0, height * 0.58, 0,
        width * 0.52, 0.02, 0,
        0, -height * 0.46, 0,
        -width * 0.52, 0.02, 0,
      ]);

      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.setIndex([0, 1, 2, 0, 2, 3]);
      geometry.computeVertexNormals();
      geometry.computeBoundingSphere();

      return geometry;
    }

    function createPetals(count) {
      const petalGeometry = createPetalGeometry();
      const petalMaterial = new THREE.MeshBasicMaterial({
        color: 0xf4a0c0,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.94,
        depthWrite: false,
      });

      petalMesh = new THREE.InstancedMesh(petalGeometry, petalMaterial, count);
      petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      petalMesh.frustumCulled = false;
      scene.add(petalMesh);

      for (let i = 0; i < count; i++) {
        petals.push(createPetal(0));
        updatePetalMatrix(i);
      }

      petalMesh.instanceMatrix.needsUpdate = true;
    }

    function createPetal(now) {
      const petal = {
        position: new THREE.Vector3(),
        velocity: new THREE.Vector3(),
        rotation: new THREE.Euler(),
        rotationSpeed: new THREE.Vector3(),
        windPhase: Math.random() * Math.PI * 2,
        fallSpeed: CONFIG.fallSpeedMin,
        active: true,
        groundY: CONFIG.groundY,
        respawnAt: 0,
        scale: 1,
      };

      resetPetal(petal, now);
      return petal;
    }

    function sampleSpawnPoint() {
      const anchor = treeSpawnAnchors[(Math.random() * treeSpawnAnchors.length) | 0];
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * anchor.spread;
      const heightJitter = (Math.random() - 0.5) * 0.75;

      return new THREE.Vector3(
        anchor.x + Math.cos(angle) * radius * 0.85,
        anchor.y + heightJitter,
        anchor.z + Math.sin(angle) * radius * 0.85
      );
    }

    function resetPetal(petal, now) {
      const spawn = sampleSpawnPoint();
      const drift = 0.012 + Math.random() * 0.012;
      const spreadX = (Math.random() - 0.5) * drift;
      const spreadZ = (Math.random() - 0.5) * drift;

      petal.position.copy(spawn);
      petal.velocity.set(spreadX, -0.002 - Math.random() * 0.003, spreadZ);
      petal.rotation.set(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI
      );
      petal.rotationSpeed.set(
        (Math.random() - 0.5) * 0.03,
        (Math.random() - 0.5) * 0.02,
        (Math.random() - 0.5) * 0.03
      );
      petal.windPhase = Math.random() * Math.PI * 2;
      petal.fallSpeed = CONFIG.fallSpeedMin + Math.random() * (CONFIG.fallSpeedMax - CONFIG.fallSpeedMin);
      petal.scale = 0.78 + Math.random() * 0.5;
      petal.active = true;
      petal.respawnAt = now + 0.9 + Math.random() * 1.4;

    }

    function updatePetalMatrix(index) {
      const petal = petals[index];
      dummy.position.copy(petal.position);
      dummy.rotation.copy(petal.rotation);
      dummy.scale.setScalar(petal.scale);
      dummy.updateMatrix();
      petalMesh.setMatrixAt(index, dummy.matrix);
    }

    function updatePetals(time) {
      for (let i = 0; i < petals.length; i++) {
        const petal = petals[i];

        if (!petal.active) {
          if (time >= petal.respawnAt) {
            resetPetal(petal, time);
          }
          updatePetalMatrix(i);
          continue;
        }

        petal.velocity.y -= CONFIG.gravity + petal.fallSpeed * 0.00015;
        petal.velocity.x += Math.sin(time * 0.8 + petal.windPhase) * CONFIG.windStrength;
        petal.velocity.z += Math.cos(time * 0.6 + petal.windPhase) * CONFIG.windStrength * 0.66;
        petal.velocity.multiplyScalar(CONFIG.airResistance);
        petal.position.add(petal.velocity);

        petal.rotation.x += petal.rotationSpeed.x;
        petal.rotation.y += petal.rotationSpeed.y;
        petal.rotation.z += petal.rotationSpeed.z;

        if (petal.position.y < petal.groundY) {
          petal.position.y = petal.groundY;
          petal.velocity.set(0, 0, 0);
          petal.rotationSpeed.set(0, 0, 0);
          petal.active = false;
          petal.respawnAt = time + 1.2 + Math.random() * 1.5;
        }

        updatePetalMatrix(i);
      }

      petalMesh.instanceMatrix.needsUpdate = true;
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }

    function updateFps(now) {
      fpsFrames += 1;
      if (now - fpsStamp >= 1000) {
        const fps = Math.round((fpsFrames * 1000) / (now - fpsStamp));
        fpsEl.textContent = `${fps} fps`;
        fpsFrames = 0;
        fpsStamp = now;
      }
    }

    function animate() {
      const elapsed = clock.getElapsedTime();
      updatePetals(elapsed);
      controls.update();
      renderer.render(scene, camera);
      updateFps(performance.now());
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
